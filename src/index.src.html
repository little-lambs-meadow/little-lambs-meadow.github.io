<script>
/* ============ 資料層（之後換成 Google 試算表 / Firebase 只需改這裡） ============ */

const DB={
 load(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&d.settings)return DB.fix(d)}}catch(e){}return demo()},
 fix(d){{{d.invites=d.invites||[];(d.log||[]).forEach(l=>{if(!l.id){l.id=uid();l.t=l.t||0}});if(d.settings.auth===undefined)d.settings.auth=false;if(!d.settings.rules)d.settings.rules=DEFAULT_RULES.slice();if(!d.settings.reasons)d.settings.reasons=DEFAULT_REASONS.slice();if(d.settings.dailyCap===undefined)d.settings.dailyCap=10;Object.keys(d.settings).forEach(k=>{if(!/^[A-Za-z_]\w*$/.test(k))delete d.settings[k]});if(!d.settings.church)d.settings.church='小羊樂園';if(!d.settings.prayer)d.settings.prayer=DEFAULT_PRAYER;if(!d.settings.cutoff){d.settings.cutoff='10:30';d.settings.onPts=2;d.settings.latePts=1}if((d.settings.items||[]).map(x=>x.name).join()==='背金句,帶聖經,幫忙收拾,熱心參與')d.settings.items=DEFAULT_ITEMS.map(x=>Object.assign({},x));const dm=demo();(d.lessons||[]).forEach(l=>{const x=dm.lessons.find(y=>y.title===l.title&&y.video===l.video);if(x){['intro','iceName','prayer'].forEach(k=>{if(!l[k])l[k]=x[k]})}});(d.songs||[]).forEach(sg=>{if(sg.title==='（示範）本季主題詩歌'&&sg.theme===undefined)sg.theme=true});d.settings.teacherNames=d.settings.teacherNames||['王老師','李老師'];d.teachers=(d.teachers||[]).filter(t=>t.pwHash);return d}}},
 save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){toast('無法儲存，請用「設定 → 匯出備份」')}}
};
function demo(){
 const k=['小明','小美','小恩','小約翰'].map(n=>({id:uid(),name:n,group:'',active:true,flag:false,flagNote:''}));
 return {
  settings:{church:'小羊樂園',rules:DEFAULT_RULES.slice(),reasons:DEFAULT_REASONS.slice(),prayer:DEFAULT_PRAYER,auth:false,teacherNames:['王老師','李老師'],requireLogin:false,cutoff:'10:30',onPts:2,latePts:1,dailyCap:10,
   items:DEFAULT_ITEMS.map(x=>Object.assign({},x)),
   rewards:[{name:'貼紙',cost:5},{name:'文具',cost:15},{name:'小禮物',cost:30}]},
  teachers:[],invites:[],
  lessons:[
   {id:uid(),season:'第一季',no:1,date:'2026-11-01',title:'世界的開始',scripture:'創世記 1–3 章',
    video:'https://www.youtube.com/watch?v=j8lHcRzyIHY',
    iceName:'黑暗與光的創造之旅',intro:'今天我們要跟著超級妙妙書的主角們，一起穿越時空回到「起初」——世界還沒有開始的時候！\n看影片時請注意：神創造了哪些東西？神每天創造完以後說了什麼？',prayer:'親愛的天父，謝謝祢創造了這麼美麗的世界，也謝謝祢創造了我。求祢幫助我每天都記得，我是祢特別的作品。奉主耶穌基督的名禱告，阿們。',story:'神用說話創造了光、天空、海洋、植物、動物，最後照著自己的形像造人，並在第七天安息。神看著一切都「甚好」。\n重點：世界不是偶然出現的，是神用愛精心創造的，每個孩子都是神特別的作品。',
    expSteps:['（5分）黑暗開場：關燈，只說「起初，地是空虛混沌」，停十秒讓孩子感受黑暗','（3分）要有光：老師說「要有光！」同時打開燈或手電筒，問孩子剛才的感受','（10分）創造感官站：分組輪流摸水（海）、泥土（地）、樹葉（植物）、毛絨玩具（動物）','（10分）我是神的作品：每人用黏土捏一個「神造的東西」，介紹給大家','（3分）第七天安息：全體躺下或趴下，安靜一分鐘，感謝神'],
    props:['手電筒數支','臉盆裝水、毛巾','一盒泥土或沙','樹葉、花','毛絨動物玩具','黏土（每人一份）'],
    safety:'關燈時保留一盞小夜燈；玩水區鋪報紙並準備毛巾。',
    questions:['神創造的東西裡，你最喜歡哪一個？為什麼？','神說人是照著祂的形像造的，這代表什麼？','你覺得神看見你的時候，會說什麼？'],
    verseRef:'創世記 1:1',verseZh:'起初，神創造天地。',verseEn:'In the beginning God created the heaven and the earth.',
    songIds:[],notes:'【示範課程】影片約 25 分鐘，可只播前半段再進體驗活動。'}
  ],
  songs:[{id:uid(),title:'（示範）本季主題詩歌',season:'第一季',theme:true,video:'',lyrics:'在「老師區 → 詩歌」貼上教會使用的歌詞版本，\n上課時就能在這裡投影。\n\n可以用 A− / A＋ 調整字體大小，\n按 ⛶ 全螢幕投影。',notes:'動作：副歌時大家拍手兩下'}],
  shows:[{id:uid(),season:'第一季',date:'2026-12-20',title:'第一季成果發表（示範）',items:[['開場詩歌','全體小朋友','5'],['金句背誦：創世記 1:1（中英）','全體小朋友','3'],['短劇：七天的創造','國小組','8'],['結尾詩歌與禱告','全體','5']],tasks:[{t:'訂主堂場地',o:'王老師',done:true},{t:'短劇道具：太陽月亮星星頭飾',o:'李老師',done:false},{t:'邀請家長的通知單',o:'王老師',done:false}],notes:'彩排：12/13 主日學後'}],kids:k,ledger:[],attend:{},sessions:[],meetings:[],log:[]
 };
}
let D=DB.load();
let myName='';try{myName=sessionStorage.getItem('ss_name')||''}catch(e){}
function who(){return user||(mode==='staff'?(myName||'老師'):'教學模式')}
function save(act){if(act){D.log.unshift({id:uid(),t:Date.now(),ts:new Date().toLocaleString('zh-TW'),by:who(),act});D.log=D.log.slice(0,300)}DB.save(D);cloudSoon()}
/* ============ 雲端同步（Google 試算表） ============ */
const CLOUD_URL_DEFAULT='https://script.google.com/macros/s/AKfycby5cqFp80G1Cdg6EYMbmY40zP1wckca4k2dFedeQ0dJ1bSQLbZS-gqY6qRGGUR0geiaRw/exec';
const CK='llm_cloud_v1';
function splitSettings(b){if(b['settings/main']){try{const s=JSON.parse(b['settings/main']);Object.keys(s).forEach(k=>{if(!(('settings/'+k) in b))b['settings/'+k]=JSON.stringify(s[k])})}catch(e){}delete b['settings/main']}return b}
const Cloud={url:'',pw:'',ver:0,base:{},snap:{},busy:false,state:'off',lastOk:0,needRebuild:false,needRender:false,skip:false,t2:null};
(function(){let c={};try{c=JSON.parse(localStorage.getItem(CK)||'{}')}catch(e){}
 Cloud.url=c.url||CLOUD_URL_DEFAULT;Cloud.pw=c.pw||'';Cloud.ver=c.ver||0;Cloud.base=splitSettings(c.base||{});Cloud.snap=Object.assign({},Cloud.base);Cloud.skip=!!c.skip})();
function cloudPersist(){try{localStorage.setItem(CK,JSON.stringify({url:Cloud.url,pw:Cloud.pw,ver:Cloud.bver||Cloud.ver,base:Cloud.base,skip:Cloud.skip}))}catch(e){}}
const COLS=['teachers','invites','lessons','songs','shows','kids','ledger','sessions','log'];
/* 設定每一項分開同步（settings/規則、settings/點數項目…），避免舊裝置整包覆蓋別人剛改好的設定 */
function toRecs(d){const r={};Object.keys(d.settings||{}).forEach(k=>{if(d.settings[k]!==undefined&&/^[A-Za-z_]\w*$/.test(k))r['settings/'+k]=JSON.stringify(d.settings[k])});
 COLS.forEach(c=>(d[c]||[]).forEach(x=>{const id=c==='invites'?x.code:x.id;if(id)r[c+'/'+id]=JSON.stringify(x)}));
 (d.meetings||[]).forEach(m=>{const o=Object.assign({},m);delete o.entries;r['meetings/'+m.id]=JSON.stringify(o);
  (m.entries||[]).forEach(e=>{r['mentries/'+e.id]=JSON.stringify(Object.assign({mid:m.id},e))})});
 Object.keys(d.attend||{}).forEach(dt=>Object.keys(d.attend[dt]).forEach(k=>{r['attend/'+dt+'|'+k]=JSON.stringify({d:dt,k:k,lid:d.attend[dt][k]})}));
 return r}
function fromRecs(r){const d={settings:null,meetings:[],attend:{}};COLS.forEach(c=>d[c]=[]);const ents=[];let sMain=null;const sPer={};
 Object.keys(r).forEach(k=>{const c=k.slice(0,k.indexOf('/'));let v;try{v=JSON.parse(r[k])}catch(e){return}
  if(c==='settings'){const sk=k.slice(9);if(sk==='main'){if(v&&typeof v==='object'&&!Array.isArray(v))sMain=v}else if(/^[A-Za-z_]\w*$/.test(sk))sPer[sk]=v}else if(c==='meetings'){v.entries=[];d.meetings.push(v)}else if(c==='mentries')ents.push(v);
  else if(c==='attend')(d.attend[v.d]=d.attend[v.d]||{})[v.k]=v.lid;else if(d[c])d[c].push(v)});
 ents.sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(e=>{const m=d.meetings.find(x=>x.id===e.mid);if(m){const o=Object.assign({},e);delete o.mid;m.entries.push(o)}});
 d.log.sort((a,b)=>(b.t||0)-(a.t||0));d.log=d.log.slice(0,300);
 if(sMain||Object.keys(sPer).length)d.settings=Object.assign({},demo().settings,sMain||{},sPer);  // 缺少的設定用預設值補上
 if(!d.settings)d.settings=demo().settings;
 return DB.fix(d)}
/* 雲端沒有、由預設值補上的設定，視為已同步（不可當成本機修改推回雲端，否則會蓋掉別台剛改的設定） */
let DEF_SET=null;
function baseWithDefaults(snap){const b=Object.assign({},snap),df=DEF_SET||(DEF_SET=demo().settings);
 Object.keys(df).forEach(k=>{const key='settings/'+k;if(!(key in b)&&df[k]!==undefined&&D.settings&&JSON.stringify(D.settings[k])===JSON.stringify(df[k]))b[key]=JSON.stringify(df[k])});return b}
function cloudDirty(){const L=toRecs(D),B=baseWithDefaults(Cloud.base),out=[];
 Object.keys(L).forEach(k=>{if(L[k]!==B[k])out.push({k,j:L[k]})});
 Object.keys(B).forEach(k=>{if(!(k in L)&&k.indexOf('settings/')!==0)out.push({k,j:null})});return out}  // 設定項目永遠不刪除
function cloudPost(body){
 const ctl=window.AbortController?new AbortController():null;const tm=setTimeout(()=>ctl&&ctl.abort(),20000);
 return fetch(Cloud.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ctl?ctl.signal:undefined})
  .then(r=>r.json()).then(j=>{clearTimeout(tm);return j},e=>{clearTimeout(tm);throw e})}
function cloudSafe(){return !document.getElementById('modal').classList.contains('on')}
function cloudRebuild(){
 const dirty=cloudDirty();const m=Object.assign({},Cloud.snap);
 dirty.forEach(x=>{if(x.j===null)delete m[x.k];else m[x.k]=x.j});
 D=fromRecs(m);DB.save(D);Cloud.base=baseWithDefaults(Cloud.snap);Cloud.bver=Cloud.ver;Cloud.needRebuild=false;cloudPersist();cloudRender()}
function cloudRender(){
 const busyUI=document.querySelector('#app iframe')||elFs();
 if(busyUI){Cloud.needRender=true;cloudBadgeUpdate();return}
 Cloud.needRender=false;
 const keep={};document.querySelectorAll('#app input[id],#app textarea[id],#app select[id]').forEach(e=>{keep[e.id]=e.type==='checkbox'?e.checked:e.value});
 const ae=document.activeElement,fid=ae&&ae.id&&ae.closest&&ae.closest('#app')?ae.id:null,sel=fid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
 render();
 Object.keys(keep).forEach(id=>{const e=document.getElementById(id);if(e){if(e.type==='checkbox')e.checked=keep[id];else if(e.type!=='file')e.value=keep[id]}});
 if(fid){const e=document.getElementById(fid);if(e){e.focus();if(sel&&e.setSelectionRange)try{e.setSelectionRange(sel[0],sel[1])}catch(x){}}}}
function cloudSoon(){if(!Cloud.pw)return;clearTimeout(Cloud.t2);Cloud.t2=setTimeout(cloudTick,250)}
function cloudTick(){
 if(!Cloud.url||!Cloud.pw||Cloud.busy)return;
 const first=!Cloud.pulled&&!Cloud.ver&&!Object.keys(Cloud.base).length;
 const recs=first?[]:cloudDirty();
 if(document.hidden&&!recs.length)return;
 Cloud.busy=true;if(recs.length)Cloud.state='saving';cloudBadgeUpdate();
 cloudPost({op:'sync',cv:2,pw:Cloud.pw,since:Cloud.ver,recs:recs,by:who()}).then(res=>{
  Cloud.busy=false;
  if(!res.ok){if(res.err==='pw'){Cloud.pw='';Cloud.state='pw';cloudPersist();cloudBadgeUpdate();cloudPwDlg(false)}else if(res.err==='noinit'){Cloud.state='pw';cloudPwDlg(true)}else{Cloud.state='err';cloudBadgeUpdate()}return}
  Cloud.state='ok';Cloud.lastOk=Date.now();
  recs.forEach(x=>{if(x.j===null){delete Cloud.snap[x.k];delete Cloud.base[x.k]}else{Cloud.snap[x.k]=x.j;Cloud.base[x.k]=x.j}});
  let changed=false;
  (res.recs||[]).forEach(x=>{if(x.j===null){if(x.k in Cloud.snap){delete Cloud.snap[x.k];changed=true}}else if(Cloud.snap[x.k]!==x.j){Cloud.snap[x.k]=x.j;changed=true}});
  Cloud.ver=res.ver;Cloud.pulled=true;
  if(first){
   if(Object.keys(Cloud.snap).length){try{localStorage.setItem('llm_local_backup',JSON.stringify(D))}catch(e){}Cloud.base={};D=fromRecs(Cloud.snap);DB.save(D);Cloud.base=baseWithDefaults(Cloud.snap);Cloud.bver=Cloud.ver;cloudPersist();cloudRender();toast('☁️ 已從雲端載入資料')}
   else{Cloud.bver=0;cloudPersist();toast('☁️ 第一次連線，正在上傳這台裝置的資料');setTimeout(cloudTick,50)}
   return}
  if(changed){if(cloudSafe())cloudRebuild();else Cloud.needRebuild=true}
  else{if(!recs.length&&!Cloud.needRebuild){Cloud.bver=Cloud.ver}cloudPersist()}
  cloudBadgeUpdate();
 },()=>{Cloud.busy=false;Cloud.state='off';cloudBadgeUpdate()});
}
function cloudBadge(){if(!Cloud.url)return '';
 const m={ok:['☁️','已同步'],saving:['⏳','儲存中'],off:['⚠️','離線'],err:['⚠️','同步錯誤'],pw:['🔒','需要密碼']}[Cloud.pw?Cloud.state:'pw']||['☁️',''];
 return `<button class="sm" id="cloudBadge" style="background:rgba(255,255,255,.25);color:#fff" onclick="cloudDlg()">${m[0]} <span class="uname">${m[1]}</span></button>`}
function cloudBadgeUpdate(){const b=document.getElementById('mBtn');if(b)b.outerHTML=menuBtn();const m=document.getElementById('hmenu');if(m)m.innerHTML=menuHtml()}
function cloudPwDlg(init){if(!cloudSafe()&&!document.getElementById('cl_pw'))return;
 openModal(`<h2>🔒 ${init?'設定教會密碼':'輸入教會密碼'}</h2>
 <p class="muted">${init?'第一次使用雲端同步，請設定一組教會密碼（至少 4 碼）。之後每台裝置第一次打開時輸入一次就好。':'小羊樂園的資料存在教會的雲端，請輸入教會密碼。每台裝置只需要輸入一次。'}</p>
 <label class="f">教會密碼<input id="cl_pw" type="password" onkeydown="if(event.key==='Enter'&&!${init})cloudPwOk(false)"></label>
 ${init?'<label class="f">再輸入一次<input id="cl_pw2" type="password"></label>':''}
 <div class="actions"><button class="blue" onclick="cloudPwOk(${init})">確定</button><button class="ghost" onclick="Cloud.skip=true;cloudPersist();closeModal()">先不連線（只用這台裝置）</button></div>`);
 setTimeout(()=>{const e=document.getElementById('cl_pw');e&&e.focus()},50)}
function cloudPwOk(init){const p=document.getElementById('cl_pw').value;
 if(p.length<4){toast('密碼至少 4 碼');return}
 if(init&&p!==document.getElementById('cl_pw2').value){toast('兩次密碼不一樣');return}
 const go2=()=>cloudPost({op:'sync',pw:p,since:0,recs:[]}).then(r=>{
  if(!r.ok){toast(r.err==='pw'?'密碼不正確':'連線失敗，請稍後再試');return}
  Cloud.pw=p;Cloud.skip=false;cloudPersist();closeModal();toast('☁️ 已連上雲端');cloudTick()},()=>toast('連線失敗，請檢查網路'));
 if(init)cloudPost({op:'init',newpw:p}).then(r=>{if(r.ok||r.err==='already')go2();else toast('設定失敗')},()=>toast('連線失敗，請檢查網路'));else go2()}
function cloudDlg(){
 if(!Cloud.pw){Cloud.skip=false;cloudPost({op:'sync',pw:'',since:0}).then(r=>cloudPwDlg(r.err==='noinit'),()=>toast('連線失敗，請檢查網路'));return}
 const ago=Cloud.lastOk?Math.round((Date.now()-Cloud.lastOk)/1000)+' 秒前':'尚未成功';

 if(!v&&!l)return null;
 const key=(v||'L')+(l?'_'+l.slice(-10):'');
 return ytReg(key,v?'https://www.youtube.com/embed/'+v+(l?'?list='+l:''):'https://www.youtube.com/embed/videoseries?list='+l,

let FORM=null;
function form(title,fields,obj,onSave,extra=''){
 FORM={fields,onSave};
 openModal(`<h2>${title}</h2>${fields.map(f=>fieldHtml(f,obj)).join('')}${extra}
  <div class="actions"><button class="pri" onclick="submitForm()">儲存</button><button class="ghost" onclick="closeModal()">取消</button></div>`);

function fieldHtml([k,label,type='text',opts],o){
 const v=o[k];const id='f_'+k;
 if(type==='textarea')return `<label class="f">${label}<textarea id="${id}">${h(v)}</textarea></label>`;
 if(type==='lines')return `<label class="f">${label}<textarea id="${id}">${h((v||[]).join('\n'))}</textarea></label>`;
 if(type==='rows'){const rows=(v||[]).length?v:[[]];  // 表格式欄位：每一行分成幾格，不用打「|」
  return `<div class="f" style="margin-top:12px"><div>${label}</div><div class="rhead">${opts.map(c=>`<span style="flex:${c.w||1}">${h(c.label)}</span>`).join('')}<span class="rbtn"></span></div>
  <div class="rows" id="${id}" data-cols="${h(JSON.stringify(opts))}">${rows.map(r=>rowHtml(opts,r)).join('')}</div>
  <button type="button" class="sm ghost" style="margin-top:6px" onclick="rowAdd('${id}')">＋ 新增一行</button></div>`}
 if(type==='select')return `<label class="f">${label}<select id="${id}">${opts.map(([a,b])=>`<option value="${h(a)}" ${a===v?'selected':''}>${h(b)}</option>`).join('')}</select></label>`;
 if(type==='checks')return `<label class="f">${label}<div class="checks" id="${id}">${opts.map(n=>`<label><input type="checkbox" value="${h(n)}" ${(v||[]).includes(n)?'checked':''}> ${h(n)}</label>`).join('')}</div></label>`;
 if(type==='bool')return `<label class="f"><input type="checkbox" id="${id}" ${v?'checked':''}> ${label}</label>`;
 return `<label class="f">${label}<input id="${id}" type="${type}" value="${h(v)}"></label>`;
}
function submitForm(){
 const out={};
 for(const [k,,type] of FORM.fields){const e=document.getElementById('f_'+k);
  if(type==='lines')out[k]=e.value.split('\n').map(x=>x.trim()).filter(Boolean);
  else if(type==='rows')out[k]=[...e.querySelectorAll('.rrow')].map(r=>[...r.querySelectorAll('input')].map(i=>i.value.trim())).filter(r=>r[0]);
  else if(type==='checks')out[k]=[...e.querySelectorAll('input:checked')].map(x=>x.value);
  else if(type==='bool')out[k]=e.checked;
  else if(type==='number')out[k]=Number(e.value)||0;
  else out[k]=e.value.trim();}
 if(FORM.onSave(out)!==false){closeModal();render()}
}
function rowHtml(cols,vals){vals=vals||[];return `<div class="rrow">${cols.map((c,i)=>`<input style="flex:${c.w||1}" ${c.type?`type="${c.type}" min="0"`:''} placeholder="${h(c.ph||c.label)}" value="${h(vals[i]==null?'':vals[i])}">`).join('')}<span class="rbtn"><button type="button" class="sm ghost" title="往上移" onclick="rowMove(this)">↑</button><button type="button" class="sm ghost" title="刪除這一行" onclick="rowDel(this)">✕</button></span></div>`}
function rowAdd(id){const e=document.getElementById(id);e.insertAdjacentHTML('beforeend',rowHtml(JSON.parse(e.dataset.cols)));const r=e.lastElementChild.querySelector('input');r&&r.focus()}
function rowDel(b){const r=b.closest('.rrow'),box=r.parentNode;r.remove();if(!box.children.length)rowAdd(box.id)}
function rowMove(b){const r=b.closest('.rrow');if(r.previousElementSibling)r.parentNode.insertBefore(r,r.previousElementSibling)}
function pairs(lines,numeric){return lines.map(s=>{const p=s.split('|').map(x=>x.trim());return p}).filter(p=>p[0])}

const SB_EPS=[{"c":"s1-01","cf":"7b0acc1b4fcfa1c084c62c8194da58df","p":164,"t":"世界的開始","d":"克里斯不聽父親的話，偷偷潛入實驗室看教授的最新發明，結果險些毀掉尚未完成的最高機密專案。克里斯嚇壞了，他不知道該怎樣對父親說這件事。這時，妙妙書出現，並帶領三位小主人公目睹了一場激烈的天使之戰。他們看到路西弗墮落變形為撒但。撒但被摔到地上後，克里斯、喬伊和吉寶目睹了伊甸園裡本來的完美世界因為亞當和夏娃的悖逆遭到毀壞。故事高潮處，上帝在園中尋找亞當和夏娃，伊甸園的大門緊鎖，亞當和夏娃被關在外面。妙妙書最終把孩子們帶回到現代，並給他們留下了一個重要的資訊：上帝愛我們，並願意饒恕我們。克里斯明白了：我們都是人，在我們軟弱時會作出不應該做的事。教授依然愛克里斯，最終原諒了他，但他也讓克里斯知道行為是有後果的。"},{"c":"s1-02","cf":"fa67356d032a4ea97312d80e14463a3d","p":165,"t":"亞伯拉罕的考驗","d":"克里斯從來沒有這麼興奮過。他的生日禮物是Holo9終極全息遊戲系統！當地醫院有個病重的男孩也想要一臺，可是連醫院都沒辦法幫他買到。克里斯感到一陣愧疚。妙妙書帶孩子們見到了亞伯拉罕和他的愛子以撒。亞伯拉罕知道上帝要他把以撒獻上，他就順服。亞伯拉罕把上帝放在他生命中的第一位，超過其他一切。回家後，克里斯把自己心愛的Holo9送給了住院的那個男孩。他犧牲了對他來說很重要的東西，因為他知道這是上帝要他做的。"},{"c":"s1-03","cf":"ed9cd4af309656fd4d5251b9b583eefb","p":166,"t":"兄弟之爭","d":"一場水仗中，喬伊不小心弄溼了吉寶的內部系統。吉寶功能錯亂，突然認為自己的主人是喬伊。克里斯很生氣，說自己絕對不會原諒喬伊。妙妙書把孩子們帶回到雅各和以掃的時代。這對雙胞胎兄弟在以掃放棄長子權利、雅各騙取父親的祝福後，疏遠了許多年。最終雅各回去見以掃，以掃也從心底饒恕了雅各。克里斯深受感動，他也原諒了喬伊。兩個人重新成為了最好的朋友。"},{"c":"s1-04","cf":"5b6c8d76e867c216b6f05d0e2bdb8cb7","p":167,"t":"出埃及記","d":"克里斯、喬伊和吉寶一起回顧他們經歷過的超級妙妙書歷險，卻無法選出最佳歷險。妙妙書帶他們和摩西一起前行，目睹了上帝在燃燒的荊棘中呼召摩西。摩西懷疑自己的能力，但上帝卻鼓勵他。孩子們繼續和他一起經歷了十災、出埃及和過紅海。克里斯看到上帝竟使用一個普通的牧羊人來拯救以色列人，這讓他很驚訝。"},{"c":"s1-05","cf":"6b50e7fc11ebbac45b0291e7985ce1d3","p":168,"t":"摩西十誡","d":"昆騰一家去露營，克里斯暗自決定無視父母和護林人制定的規則，結果讓自己、吉寶和喬伊困在了一個漆黑的洞穴裡。妙妙書帶孩子們回到以色列人面對律法挑戰的時代。摩西上山與上帝相會，山下的以色列人不遵守規則使他們陷入了道德混亂。摩西帶著十誡法版下山，這深刻地提醒了克里斯遵守規則的重要性：慈愛的上帝是為了百姓的益處制定了十誡。"},{"c":"s1-06","cf":"da46edf2d8b97409bbecce059e8019d6","p":169,"t":"面對巨人","d":"克里斯沒有勇氣在眾人面前彈吉他。妙妙書帶孩子們與年幼的大衛成了朋友，當時大衛正給在前線與非利士人對陣的哥哥們送飯。當大衛說自己要迎戰巨人歌利亞時，所有人都笑他。但是，上帝與大衛同在，大衛打敗了歌利亞。克里斯意識到，如果他面對自己的巨人，為上帝演奏，上帝會賜給他所需的勇氣！回家後，克里斯再次參加試演，成功地加入了樂隊。"},{"c":"s1-07","cf":"6daba0f6de1f54ba190ab77c4314cebb","p":170,"t":"獅口逃生","d":"小男孩托米被滑板公園的惡霸欺負，克里斯需要去做正確的事。妙妙書帶領孩子們在巴比倫見到了但以理和大流士王。國王下令：任何敬拜國王以外的人都會被處死。但以理在信仰遇到挑戰時毫不屈服，在窗前禱告，因而被扔進了獅子坑。在危難時刻，上帝解救了但以理，國王下令所有人敬拜但以理所信的獨一真神。回到滑板公園，克里斯勇敢地站了出來，幫助了被欺負的小男孩。當你做正確的事，上帝會保護你。"},{"c":"s1-08","cf":"d7b4756aba774c4b554f6ca7b1621c57","p":171,"t":"第一個聖誕節","d":"昆騰家充斥著商業化聖誕節的混亂氛圍，沒有把和平的君放在第一位。妙妙書帶著孩子們去探索聖誕節的真正意義。他們發現希律王秘密計畫阻撓新王的出生，並和馬利亞、約瑟一起前往伯利恆。耶穌降生，天使和牧羊人都來到馬廄中，同心歡唱榮耀和讚美。孩子們回到家，把平安夜的預備重點放在了基督的誕生上。"},{"c":"s1-09","cf":"bbe4818a555b90bec06d8bc73f8a51b3","p":172,"t":"真正的神蹟","d":"就在克里斯開始相信魔術師擁有超能力時，妙妙書帶領孩子們回到了古代加利利，耶穌醫治瘸子、平靜風浪並趕出汙鬼。克里斯明白了：只有上帝能施行神蹟。回家後，他發現魔術師使用的是很聰明的魔術技法，但依然是人為的把戲。"},{"c":"s1-10","cf":"7b95d14fa0f59bc596f6caaccf92bd0d","p":173,"t":"最後的晚餐","d":"克里斯的樂隊受邀上電視節目，他開始自我膨脹，希望喬伊和吉寶用對待巨星的態度對待自己。妙妙書帶孩子們來到耶路撒冷，耶穌正榮耀進城。克里斯羨慕耶穌的名氣，然而在最後的晚餐上，耶穌謙卑的服侍深深地觸動了他。回家後，克里斯開始幫助樂隊成員，他的目標不再是名氣和財富，而是謙卑和服侍。"},{"c":"s1-11","cf":"df037cad46a0188c1087d8725b857de3","p":174,"t":"他復活了","d":"克里斯和母親菲比之間發生了爭吵。妙妙書這次也帶上了菲比一起穿越時空。他們見到了耶穌的母親，目睹了耶穌在彼拉多面前受審、前往骷髏地、被釘死在十字架上以及榮耀的復活。克里斯目睹了馬利亞對兒子的付出，也看到耶穌對母親的愛。於是，克里斯越發敬重自己的母親。"},{"c":"s1-12","cf":"be478b5e3de6921348fed41a84cf73ba","p":208,"t":"生命大翻轉","d":"一個不良少年闖入了克里斯和喬伊的生活，他們認為他沒有任何改變的可能。妙妙書帶孩子們來到基督教的初期，見到了兇暴的大數人掃羅。掃羅在前往大馬士革的路上發生了驚人的轉變，接受亞拿尼亞的醫治和洗禮，曾經迫害人的掃羅變成被迫害的保羅。孩子們學到：上帝可以奇妙地改變任何人。"},{"c":"s1-13","cf":"328ba18aa7e125d4b73c295e062466e3","p":209,"t":"末日之戰","d":"克里斯意外地把自己家的房子燒燬了，他覺得這麼重大的錯誤不可能得到原諒！妙妙書讓他們看到終極的饒恕一直是上帝對人類計畫的一部分。克里斯在沙漠中遇到了引誘他的撒但；喬伊和吉寶來到天國，約翰正在記錄上帝給他的啟示。上帝擊敗撒但，新耶路撒冷降臨在地上。回家後，克里斯的父親出於愛原諒了他。克里斯明白了上帝對我們有個美好的計畫，願意我們每個人都得救。"},{"c":"s2-01","cf":"191e05987c8cbcb8e99b93563085c46e","p":175,"t":"約拿與大魚","d":"喬伊目睹同學偷竊腳踏車並告知校長，校長卻原諒了她，喬伊很不服氣。妙妙書帶孩子們見到了正在躲避上帝的約拿。約拿沒有聽上帝的指示，巨大的風暴興起，他被扔下船，一條大魚把約拿吞下，帶到了岸上。約拿向尼尼微百姓宣告上帝的警示，全城的人都悔改了，約拿卻氣憤上帝沒有懲罰他們。喬伊明白應該饒恕人並給予人改過自新的機會，即便是她不喜歡的人。"},{"c":"s2-02","cf":"f3d5c93029d3cf704b582a7ff80f6a23","p":176,"t":"奇妙的夢","d":"克里斯為自己制定了非常精準的計畫，他無法忍受事情偏離他的計畫。妙妙書帶領他們回到古埃及，見證了約瑟從囚犯成為埃及宰相，並修復了與哥哥們的關係。克里斯學到，不要依靠自己的計畫，要信靠上帝的計畫。"},{"c":"s2-03","cf":"5eff794685ad1fb1aabc4be6e6ff9fe2","p":177,"t":"烈火的考驗","d":"克里斯陷入了進退兩難的窘境，不得不在對錯之間做出選擇。妙妙書帶孩子們回到尼布甲尼撒統治時期的巴比倫，見到了沙得拉、米煞和亞伯尼歌。這三人選擇順服上帝並信靠上帝的保護——無論代價如何。"},{"c":"s2-04","cf":"f69a0b6bdaf9694f89e04a0e8ccbc20f","p":178,"t":"意外的朋友","d":"喬伊和一位不太友善、競爭心很強的同學一起做學校專案，這讓她很為難。妙妙書帶孩子們來到耶利哥毀滅的時期，喬伊見到了喇合。她明白了人是會改變的，那些看似對立的人有時也會為了大家的益處而成為你的盟友。"},{"c":"s2-05","cf":"471fcf106d339113c960fc07c1a7ae8c","p":179,"t":"勇敢的王后","d":"喬伊推薦坐輪椅的女孩加入女生社團，卻遭到社團主席的質問。妙妙書帶領孩子們見到了正面臨民族危難的王后以斯帖。以斯帖表明了自己的真實身份，為正義發聲，儘管這可能意味著死亡；她的勇敢保護了一個民族。回家後的喬伊充滿勇氣和力量，做出了正確的選擇。"},{"c":"s2-06","cf":"4f3373f9410459cafa8ba70dc62771ad","p":180,"t":"曠野奇遇","d":"施洗約翰傳講認罪悔改的洗禮。耶穌來到約旦河請約翰為他施洗，約翰起初猶豫，耶穌說：“我們理當這樣盡諸般的義。”耶穌受洗後，天裂開了，聖靈彷彿鴿子降在他身上，又有聲音從天上來說：“你是我的愛子，我喜悅你！”耶穌的受洗標誌著他公開事工的開始，也表明聖父、聖子、聖靈三而一的上帝。"},{"c":"s2-07","cf":"b801a8e5ac0686a9f3152ae8b9696c3a","p":181,"t":"信心勇士","d":"喬伊和昆騰一家幫忙賑災，條件太過艱苦，喬伊覺得心有餘而力不足。妙妙書帶孩子們登上一艘載著保羅前往羅馬受審的船。途中保羅經歷接踵而來的災難，但上帝給了他堅持的勇氣，即使在最黑暗的時刻他也向人傳道。保羅的經歷鼓舞了喬伊，她回到賑災專案，被聖靈充滿，沒有什麼能阻止她。"},{"c":"s2-08","cf":"b87c38574a63832d3a6ac1f40fb2c6e3","p":182,"t":"約伯的患難","d":"克里斯的外公突然離世，他想把所有的痛苦都怪罪在某個人身上。妙妙書帶孩子們見到了正經歷超乎常人試驗的約伯。克里斯驚訝約伯在種種苦難中仍保持對上帝的信心，並從約伯身上獲得勇氣。回家後，克里斯知道上帝必不撇下他。"},{"c":"s2-09","cf":"7f45df5ffae75505c46a5e82945a9252","p":183,"t":"挪亞方舟","d":"逃課的克里斯和喬伊正和一個壞榜樣在一起。妙妙書帶三人回到邪惡橫行的世界，上帝要挪亞帶家人以及各種動物進入方舟。孩子們目睹了大洪水，以及挪亞對上帝堅定的信心。挪亞的榜樣以及上帝不再用洪水毀滅世界的應許讓他們很受感動，回家後，他們拒絕了壞榜樣的危險影響。"},{"c":"s2-10","cf":"2c81c179ac30a438a693e9eeb2b348c8","p":184,"t":"英雄的秘訣","d":"喬伊遇到一個艱難的處境，要麼接受挑戰，要麼害怕逃避。妙妙書帶孩子們見到了基甸。沒人相信基甸有能力領導以色列人對抗敵人，然而上帝與他同在，基甸在幾乎不可能的絕境中戰勝了米甸人。喬伊明白只要上帝開路，她凡事都能成。"},{"c":"s2-11","cf":"fad73e695335a92756b207ae312ae42a","p":185,"t":"彼得與耶穌","d":"克里斯渴望和學校的酷孩子一起打籃球，喬伊興奮地宣佈自己當選象棋社社長時，克里斯卻假裝不認識她。妙妙書帶三人見到了三次不認耶穌的彼得。復活後的耶穌在加利利岸邊饒恕彼得，克里斯明白自己和彼得一樣，是出於害怕才不承認與喬伊的友誼。回家後，克里斯和真正的朋友們一起為喬伊慶祝。"},{"c":"s2-12","cf":"465fd536ab525882c1beb68dbb622d82","p":186,"t":"浪子回家","d":"朋友亞倫惹了麻煩，躲在克里斯的樹屋裡避開父親。妙妙書帶孩子們見到耶穌，宗教領袖看到耶穌與罪人同席很氣憤，耶穌講述了浪子回家的比喻：無論我們做過什麼，天父都願意接納我們。回家後，克里斯告訴亞倫，只要他真誠道歉，他的父親都會原諒他，因為父親愛他。"},{"c":"s2-13","cf":"7936fc10fa31af1271fa815b522d1c86","p":207,"t":"誰是真神？","d":"克里斯沉迷於線上遊戲，想成為遊戲中最偉大的神明，忽略了朋友和家人。妙妙書帶領他們目睹了以利亞挑戰巴力的先知，讓眾人明白真神只有一位，就是全能的耶和華。克里斯謙卑地回到家，決定花更多的時間認識這位獨一的真神。"},{"c":"s3-01","cf":"269c6544d3e1cd4505c897ff43c163e0","p":187,"t":"不一樣的婆媳","d":"克里斯想去湖邊遊玩，不想幫脾氣古怪的姨奶奶幹活。妙妙書帶孩子們見到了路得，她和婆婆拿俄米一起生活，照顧婆婆。透過路得與波阿斯的故事，克里斯體會到家人之間應該彼此相愛、彼此忠誠。回家後，他放棄了遊玩計畫，把姨奶奶的房子打扮得整齊漂亮，還為她準備了家庭野餐。"},{"c":"s3-02","cf":"de8a38585ab7abcb9f09bccd776350e7","p":188,"t":"巴別塔","d":"克里斯和喬伊無法和一位來自印度的新同學溝通。妙妙書帶孩子們看到了悖逆上帝、要傳揚自己名的百姓修建高塔，上帝變亂了他們的語言。接著孩子們來到五旬節的耶路撒冷，門徒被聖靈充滿說方言，彼得傳道，有三千人信主受洗。孩子們明白上帝賜下方言的恩賜，幫助人們理解福音、齊心成就上帝的旨意。"},{"c":"s3-03","cf":"e9ae6b26606b7bc3dd2b713960bbc6a7","p":189,"t":"施洗約翰的降生","d":"喬伊不想幫忙照看一個太好動的兩歲孩子查理。妙妙書帶孩子們和查理來到古城，見到了伊利莎白和撒迦利亞，這對老夫妻得知自己將要生一個孩子，就是施洗約翰。喬伊明白上帝為每個人都預備了美好計畫，每個孩子都將成長為獨一無二的人。回家後她用全新的眼光看待小查理。"},{"c":"s3-04","cf":"a15f21cf2ab58335d37d781958c81ca1","p":190,"t":"誰是以撒的新娘","d":"克里斯幫父親組裝機器人，卻不聽指示、自作聰明，機器人脫離路線開始毀壞院子。妙妙書帶孩子們見到了為以撒尋妻的以利以謝。歷險結束後，克里斯明白了專注使命、遵照指示的重要性。"},{"c":"s3-05","cf":"778008363b05ef6068910d839f63b782","p":191,"t":"大元帥和大麻風","d":"喬伊負責一項大型服務專案，她認為自己是領導，不是做工的人，專案進展很不順利。妙妙書帶孩子們見到了乃縵的使女，見證了乃縵的大麻風得醫治。喬伊回家後，對服務和謙卑的態度改變了，立刻帶著全新的態度開展服務專案。"},{"c":"s3-06","cf":"1c3300a2edac5dde416debba3135fa85","p":192,"t":"小撒母耳的大使命","d":"克里斯夢見了曾闖入他家的男孩傑森，喬伊認為這或許是上帝在催促克里斯幫助他，克里斯卻認為自己太年輕，不可能被上帝呼召。妙妙書帶他們見到了被上帝呼召的小撒母耳。撒母耳長大後帶領百姓迴轉到上帝面前。回到現代後，克里斯回應了上帝的呼召，嘗試和傑森做朋友。"},{"c":"s3-07","cf":"e05bb581387a6c0a7219031bceec72e5","p":193,"t":"兩個王","d":"兩個少年搶走並砸碎了克里斯的吉他，憤怒的克里斯發誓要復仇。妙妙書帶孩子們見到了成年的大衛和嫉妒他、幾次要殺他的掃羅王。克里斯以為大衛會報復，但大衛在隱基底的洞穴中放過了掃羅。回家後，克里斯以大衛為榜樣，決定不再報復，他知道審判人的是上帝，而不是自己。"},{"c":"s3-08","cf":"2c052a689c86e7b72dee734a7ea09117","p":194,"t":"尼希米的勝利","d":"老師要克里斯輔導兩個取笑他熱愛科學的同學，克里斯堅持不住了。妙妙書帶孩子們回到古代耶路撒冷，見到在重建城牆時受到各種嘲諷和危險的尼希米。克里斯明白：做上帝交給你的任務時，無論誰取笑你，都要繼續手中的工作。回家後，他成功引起兩個同學對科學的興趣。"},{"c":"s3-09","cf":"3f00d273b0eeedf5316465544b23ec60","p":195,"t":"不以眼還眼的以利沙","d":"同學把喬伊的糗照影片發到網上，喬伊準備釋出對方的糗事作為報復。妙妙書帶孩子們回到先知以利沙的時代，目睹上帝保護以利沙，以利沙還懇請國王善待被俘的敵人。喬伊看到先知如此善良，回到現實後刪除了影片，兩個女孩邁出了友誼的第一步。"},{"c":"s3-10","cf":"8f0c2b5c75ee8b61e899fedd9786e5e6","p":196,"t":"走出墳墓","d":"喬伊錯過了服務俱樂部去遊樂園的巴士，一個害羞的女孩也沒趕上。妙妙書帶孩子們見到耶穌使拉撒路從死裡復活：耶穌得知拉撒路病重後等了幾天才去，為要行一個更大的神蹟。喬伊明白上帝的時間總是對的，於是和克里斯、吉寶為那個女孩設計了一系列比遊樂園更精彩的活動。"},{"c":"s3-11","cf":"10b033c1c98019bf52fdce7731d25869","p":197,"t":"所羅門的智慧","d":"爸爸讓克里斯負責一個重要的專案，他不知道該怎樣處理。妙妙書帶孩子們見到所羅門王，所羅門鼓勵克里斯把重擔交給耶和華，向祂尋求智慧。克里斯目睹所羅門用上帝賜的智慧解決難題。回到現代後，克里斯尋求上帝的帶領，解決了之前無法解決的難題。"},{"c":"s3-12","cf":"12bb1ec7c9dbb0fef96d9f968e34431b","p":198,"t":"但以理和王的夢","d":"喬伊參加了太多活動，忙得不知所措。妙妙書帶孩子們回到巴比倫，見到年輕的但以理。尼布甲尼撒王要博士們說出並解釋他的夢，否則都要喪命。但以理和三個朋友禱告求上帝幫助，上帝向但以理顯明瞭王的夢。回家後喬伊知道該怎樣尋找解決的方法，和克里斯一起禱告尋求上帝的幫助。"},{"c":"s3-13","cf":"88cbebbff9b3e9d0718a3de62b35a62a","p":210,"t":"好撒瑪利亞人","d":"孩子們看見一對姐弟拿走披薩店所有的番茄醬，要做一份番茄湯，喬伊卻認為這不關他們的事。妙妙書帶孩子們回到耶穌的時代，吉寶聽見耶穌講好撒瑪利亞人的比喻，耶穌也幫助孩子們明白比喻的意思。回到現代後，孩子們效法好撒瑪利亞人，邀請那對姐弟一起分享披薩。"},{"c":"s4-01","cf":"b6573832c012c5ce8d97e7e4dddd6253","p":215,"t":"小付出與大收穫","d":"妙妙書帶領孩子們來到迦拿的婚宴上。婚宴的酒用完了，就在大家一籌莫展時，耶穌施行神蹟，將水變為酒。妙妙書隨後帶領孩子們目睹了耶穌用五個餅和兩條魚使五千人吃飽。"},{"c":"s4-02","cf":"80d115e149384d48fc096cbc3b18c785","p":216,"t":"超越偏見","d":"克里斯上學遲到，很討厭秉公行事、不給他特殊對待的校園監察員。沒想到妙妙書竟然帶上了監察員和他們一起歷險！他們見到了彼得，彼得學習到：上帝不偏待人。"},{"c":"s4-03","cf":"f10f51a7b096009d3241244cbf2378ca","p":217,"t":"喜樂的力量","d":"喬伊悶悶不樂，因為她即將做扁桃腺手術。妙妙書帶孩子們來到腓立比，保羅和西拉被鞭打關進監獄，卻在最黑暗的時刻依然讚美上帝。地震時他們沒有逃跑，因為憐憫看守他們的獄卒，獄卒最終信主受洗。喬伊決心要像保羅和西拉那樣，即便遇到最艱難的處境也要喜樂！"},{"c":"s4-04","cf":"27a9e3b960e6baf970504bebea68d5cb","p":218,"t":"上帝的計畫最好","d":"克里斯的團隊進入全國機器人大賽決賽，他卻因規則無法參加，非常沮喪。妙妙書帶孩子們見到即將繼承王位、負責建造父親大衛所設計聖殿的所羅門。克里斯明白了最終成就的是上帝的計畫，能參與上帝的計畫才是最好的。回家後，他為團隊制定策略，團隊最終贏得冠軍。"},{"c":"s4-05","cf":"13a29976fb16f32e5304b400703ca68e","p":219,"t":"奇妙的禱告","d":"喬伊在虛擬環遊世界時見到許多人的苦難，她思索自己能否改變現狀。妙妙書帶孩子們見到彼得、羅大、馬利亞和其他跟隨耶穌的人，目睹了禱告的力量如何帶來奇妙的改變。"},{"c":"s4-06","cf":"a00306520e16f5e74de8738cea2a79e0","p":220,"t":"看見上帝的禮物","d":"克里斯認出了一所姥爺曾帶他來過的教堂，他想知道全家為什麼不再去教堂。妙妙書把孩子們帶回到過去，目睹耶穌治好了三個瞎眼的人；但是一些心靈盲目的人卻看不到耶穌就是彌賽亞。"},{"c":"s4-07","cf":"26039b626b51d5f044aec5c081b21376","p":221,"t":"不一樣的選擇","d":"克里斯成為足球隊的上場隊員，卻發現隊友想透過作弊取勝，還要他參與。妙妙書帶孩子們見到摩西派去窺探迦南地的探子。大多數探子害怕那地的巨人，迦勒和約書亞卻相信上帝的應許，不讓恐懼混淆判斷。回家後，克里斯鼓足勇氣直面作弊的隊友，做了正確的事。"},{"c":"s4-08","cf":"6a00134a67c63b7d2cfd6a2650ff2001","p":222,"t":"順服 不用問為什麼","d":"媽媽給克里斯一張購物單，讓他去不同的商店採購，他卻想自作聰明一站買齊。妙妙書帶孩子們見到以利亞，在撒勒法上帝用神蹟供應寡婦和她的兒子，以利亞順服上帝使那孩子復活。克里斯學到：順服上帝的指示，即使自己不明白為什麼。回家後他照媽媽的指示購物，才發現媽媽正為他準備驚喜生日派對。"},{"c":"s4-09","cf":"bfc0a53ecee35ba3b8883334e21ca376","p":223,"t":"耶穌的禱告","d":"克里斯的外公最近過世，外婆正在搬家，克里斯不知該如何安慰她。妙妙書帶孩子們學到每個人有不同的禱告方式，以及禱告如何建立信心，最後耶穌教導人用主禱文禱告。回家後，克里斯發現外公的禱告卡和主禱文一模一樣，他邀請外婆一起誦讀主禱文。"},{"c":"s4-10","cf":"1253bf4e10f8e60fe300658956ced414","p":224,"t":"黑暗中的堅守","d":"克里斯遇到無家可歸的一家人，想幫忙卻不知道該做什麼。妙妙書帶孩子們見到飽受侮辱、被關入牢獄卻仍堅守使命的先知耶利米，在最黑暗的日子，以伯米勒為耶利米懇求國王，先知最終獲救。回家後，克里斯堅定信念，採取行動幫助那個無家可歸的家庭。"},{"c":"s4-11","cf":"7d79f1cd7a0db8f58c8262ad0d4714b2","p":225,"t":"抵擋誘惑","d":"克里斯被引誘去玩父母不准他玩的暴力遊戲。妙妙書帶孩子們在聖殿裡見到十二歲的耶穌，又看到在曠野四十天被撒但試探的耶穌，耶穌用上帝的話抵擋試探。回家後，克里斯對閱讀聖經有了濃厚的興趣。"},{"c":"s4-12","cf":"35051c13d436b406676e91237d7eb900","p":226,"t":"福音的勇士","d":"一位同學因邀請別人參加查經小組而被取笑，克里斯感到尷尬。妙妙書帶孩子們與保羅和巴拿巴一起傳揚耶穌的資訊，他們無視逆境繼續前行。克里斯以他們為榜樣，回到學校後和喬伊、吉寶一起支援那位同學和他的查經小組。"},{"c":"s4-13","cf":"52fc7a3c729c7d44bf6eab1c40ffeebe","p":227,"t":"能力大不同","d":"克里斯想利用爸爸的新發明讓自己出名賺錢。妙妙書帶孩子們來到撒瑪利亞，見到腓利、彼得和約翰，讓當地的術士認識到聖靈的真能力；又見證了腓利為衣索比亞太監施洗。回家後，克里斯被聖靈的能力震撼，決心參加查經，邁出受洗的第一步。"},{"c":"s5-01","t":"尼羅河上的嬰孩","d":""},{"c":"s5-02","t":"真的可以重生嗎","d":""},{"c":"s5-03","t":"小壞蛋的悔改","d":""},{"c":"s5-04","t":"了不起的開始","d":""},{"c":"s5-05","t":"誰願意為上帝說話","d":""},{"c":"s5-06","t":"一個美妙的邀請","d":""},{"c":"s5-07","t":"老朋友和新朋友","d":""},{"c":"s5-08","t":"苦難中如何得勝","d":""},{"c":"s5-09","t":"以德報怨","d":""},{"c":"s5-10","t":"科學的頂峰是什麼（上）","d":""},{"c":"s5-11","t":"科學的頂峰是什麼（下）","d":""},{"c":"s5-12","t":"看不見就信的有福了","d":""},{"c":"s5-13","t":"真英雄","d":""},{"c":"s5-14","t":"上帝的拯救","d":""},{"c":"s5-15","t":"如何支配你的金錢","d":""}];

const IMP_MAP={'前言':'intro','妙妙書前言':'intro','破冰':'expSteps','破冰遊戲':'iceName','問答':'questions','禱告':'prayer','日期':'date','經文':'scripture','影片':'video','故事':'story','重點':'story','故事重點':'story','體驗':'expSteps','體驗活動':'expSteps','道具':'props','安全':'safety','安全提醒':'safety','討論':'questions','討論問題':'questions','金句出處':'verseRef','中文金句':'verseZh','金句':'verseZh','英文金句':'verseEn','備註':'notes'};
const IMP_LISTS=['expSteps','props','questions'];
function parseLessons(txt){
 const out=[];let season='第一季',L=null,sec=null;
 for(const raw of txt.split(/\r?\n/)){const line=raw.trim();if(!line)continue;
  if(/^#(?!#)/.test(line)){season=line.replace(/^#\s*/,'');L=null;continue}
  if(/^##/.test(line)){const t=line.replace(/^#+\s*/,'');const m=t.match(/^第\s*(\d+)\s*課\s*(.*)$/);
   L={id:uid(),season,no:m?Number(m[1]):out.filter(x=>x.season===season).length+1,title:m?(m[2]||t):t,date:'',scripture:'',video:'',story:'',expSteps:[],props:[],safety:'',questions:[],verseRef:'',verseZh:'',verseEn:'',songIds:[],notes:'',intro:'',iceName:'',prayer:''};out.push(L);sec=null;continue}
  if(!L)continue;
  const m=line.match(/^([^:：]{1,6})[:：]\s*(.*)$/);
  if(m&&IMP_MAP[m[1].trim()]){sec=IMP_MAP[m[1].trim()];if(m[2])put(L,sec,m[2]);continue}
  const it=line.match(/^(?:[-•*．]|\d+[.、)）])\s*(.*)$/);
  put(L,sec||'story',it&&IMP_LISTS.includes(sec)?it[1]:line);

 v.attendance=pres.length||!old?pres:(old.attendance||[]);v.by=who();  // 舊紀錄當天沒有點名資料時，保留原本的名單
 if(id)Object.assign(D.sessions.find(x=>x.id===id),v);else D.sessions.push({id:uid(),...v});
 v.kidNotes.forEach(n=>{const k=kid(n.kidId);if(k&&n.flag){k.flag=true;k.flagNote=n.note||k.flagNote}});
 save((id?'修改':'新增')+'上課紀錄 '+v.date);closeModal();render();toast('已儲存')}

/* ============ 會議 ============ */
function pMeetings(){
 return `<div class="row" style="margin-bottom:10px"><h2 class="sp">會議</h2><button class="blue" onclick="newMeeting()">＋新會議</button></div>
 <p class="muted">開會時每位老師用自己的手機進入同一個會議，各自在議程下輸入意見、決議、待辦，幾秒內大家都看得到，最後按「整合會議記錄」合成一份。</p>
 ${[...D.meetings].sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<div class="card row"><div class="sp"><b>${h(m.title)}</b><div class="muted">${h(m.date)} · ${m.agenda.length} 項議程 · ${m.entries.length} 則紀錄</div></div><button class="sm blue" onclick="curMeeting='${m.id}';go('meeting')">進入</button>${canEditMeeting(m)?` <button class="sm ghost" onclick="editMeeting('${m.id}')">編輯</button> <button class="sm danger" onclick="delMeeting('${m.id}')">刪除</button>`:''}</div>`).join('')||'<div class="empty">還沒有會議</div>'}`;
}
function newMeeting(){form('新會議',[['title','會議名稱'],['date','日期','date'],['agenda','議程（一行一項）','lines']],{date:today(),title:'主日學同工會'},v=>{
 if(!v.title)return false;const m={id:uid(),by:who(),title:v.title,date:v.date,agenda:v.agenda.map(t=>({id:uid(),title:t})),entries:[]};if(!m.agenda.length)m.agenda.push({id:uid(),title:'一般討論'});
 D.meetings.push(m);curMeeting=m.id;tab='meeting';save('新增會議 '+v.title)})}
function canEditMeeting(m){return isAdmin()||!m.by||m.by===who()}
function delMeeting(id){const m=D.meetings.find(x=>x.id===id);if(!m)return;
 if(!confirm(`確定要刪除「${m.title}」（${m.date}）？\n裡面 ${m.entries.length} 則紀錄會一起刪除，所有裝置都會同步刪除，無法復原。`))return;
 D.meetings=D.meetings.filter(x=>x.id!==id);if(curMeeting===id)tab='meetings';save('刪除會議 '+m.title+'（'+m.date+'）');render();toast('已刪除會議')}
function editMeeting(id){const m=D.meetings.find(x=>x.id===id);
 form('編輯會議',[['title','會議名稱'],['date','日期','date'],['agenda','議程（一行一項；刪掉的議程，底下的紀錄也會一起刪除）','lines']],{title:m.title,date:m.date,agenda:m.agenda.map(a=>a.title)},v=>{
  if(!v.title){toast('請填會議名稱');return false}
  const old=m.agenda.slice();const used={};
  const ag=v.agenda.map((t,i)=>{let a=old.find(x=>x.title===t&&!used[x.id]);if(!a&&old[i]&&!v.agenda.includes(old[i].title)&&!used[old[i].id])a=old[i];if(a){used[a.id]=1;return {id:a.id,title:t}}return {id:uid(),title:t}});
  if(!ag.length)ag.push({id:uid(),title:'一般討論'});
  const lost=m.entries.filter(e=>!ag.some(a=>a.id===e.aid)).length;
  if(lost&&!confirm(`有 ${lost} 則紀錄所屬的議程被刪掉了，這些紀錄會一起刪除，確定嗎？`))return false;
  m.title=v.title;m.date=v.date;m.agenda=ag;m.entries=m.entries.filter(e=>ag.some(a=>a.id===e.aid));save('修改會議 '+v.title)})}
function pMeeting(){
 const m=D.meetings.find(x=>x.id===curMeeting);if(!m)return pMeetings();
 return `<div class="row" style="margin-bottom:6px"><button class="sm ghost" onclick="go('meetings')">← 會議列表</button><span class="sp"></span><button class="sm ghost" onclick="render()">↻ 重新整理</button>${canEditMeeting(m)?`<button class="sm ghost" onclick="editMeeting('${m.id}')">✎ 編輯</button><button class="sm danger" onclick="delMeeting('${m.id}')">刪除</button>`:''}<button class="blue" onclick="compileDlg()">📋 整合會議記錄</button></div>
 <h2>${h(m.title)}</h2>${authOn()?'':`<div class="row" style="margin:6px 0"><span class="muted">我是：</span><select onchange="myName=this.value;try{sessionStorage.setItem('ss_name',myName)}catch(e){};render()"><option value="">請選擇</option>${teacherNames().map(n=>`<option ${n===myName?'selected':''}>${h(n)}</option>`).join('')}</select></div>`}<div class="muted" style="margin-bottom:10px">${h(m.date)} · 參與輸入：${[...new Set(m.entries.map(e=>e.by))].map(h).join('、')||'尚無'}</div>
 ${m.agenda.map((a,ai)=>{const es=m.entries.filter(e=>e.aid===a.id);return `<div class="card"><h3>${ai+1}. ${h(a.title)}</h3>
  ${es.map(e=>`<div class="entry ${e.type}"><span class="tag ${{決議:'d',待辦:'t',意見:'o'}[e.type]}">${e.type}</span> ${h(e.text)}${e.type==='待辦'?` <span class="muted">→ ${h(e.owner||'未指定')}${e.due?'，'+h(e.due)+'前':''}</span>`:''} <span class="muted">— ${h(e.by)}</span>${e.by===who()?` <button class="sm ghost" onclick="delEntry('${e.id}')">✕</button>`:''}</div>`).join('')}
  <div class="row" style="margin-top:8px"><select id="ty_${a.id}" onchange="document.getElementById('td_${a.id}').style.display=this.value==='待辦'?'flex':'none'"><option>意見</option><option>決議</option><option>待辦</option></select>
   <input class="sp" id="tx_${a.id}" placeholder="輸入內容" onkeydown="if(event.key==='Enter')addEntry('${a.id}')"><button class="blue" onclick="addEntry('${a.id}')">送出</button></div>
  <div class="row" id="td_${a.id}" style="display:none;margin-top:6px"><input id="ow_${a.id}" placeholder="負責人" style="width:110px"><input id="du_${a.id}" type="date"></div></div>`}).join('')}
 <div class="row"><input id="newAg" class="sp" placeholder="臨時動議／新增議程"><button class="ghost" onclick="const v=document.getElementById('newAg').value.trim();if(v){D.meetings.find(x=>x.id==='${m.id}').agenda.push({id:uid(),title:v});save();render()}">＋議程</button></div>`;
}
function addEntry(aid){if(!authOn()&&!myName){toast('請先在上方選擇「我是」哪位老師');return}const m=D.meetings.find(x=>x.id===curMeeting);const g=k=>document.getElementById(k+'_'+aid).value.trim();
 const text=g('tx');if(!text)return;const type=document.getElementById('ty_'+aid).value;
 m.entries.push({id:uid(),aid,type,text,owner:type==='待辦'?g('ow'):'',due:type==='待辦'?g('du'):'',by:who(),ts:Date.now()});save();render();
 const n=document.getElementById('tx_'+aid);n&&n.focus()}
function delEntry(id){const m=D.meetings.find(x=>x.id===curMeeting);m.entries=m.entries.filter(e=>e.id!==id);save();render()}
function compileMeeting(m){
 const ppl=[...new Set(m.entries.map(e=>e.by))];const E=t=>m.entries.filter(e=>e.type===t);
 let s=`【${m.title}】會議記錄\n日期：${m.date}\n參與：${ppl.join('、')}\n\n`;
 m.agenda.forEach((a,i)=>{const es=m.entries.filter(e=>e.aid===a.id).sort((x,y)=>x.ts-y.ts);s+=`${i+1}. ${a.title}\n`;
  const op=es.filter(e=>e.type==='意見'),dc=es.filter(e=>e.type==='決議'),td=es.filter(e=>e.type==='待辦');
  if(op.length)s+='  討論：\n'+op.map(e=>`   • ${e.text}（${e.by}）`).join('\n')+'\n';
  if(dc.length)s+='  決議：\n'+dc.map(e=>`   ✔ ${e.text}`).join('\n')+'\n';
  if(td.length)s+='  待辦：\n'+td.map(e=>`   □ ${e.text} → ${e.owner||'未指定'}${e.due?'（'+e.due+'前）':''}`).join('\n')+'\n';
  if(!es.length)s+='  （無紀錄）\n';s+='\n'});
 if(E('決議').length)s+='━━ 決議總表 ━━\n'+E('決議').map((e,i)=>`${i+1}. ${e.text}`).join('\n')+'\n\n';
 if(E('待辦').length)s+='━━ 待辦事項 ━━\n'+E('待辦').sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).map((e,i)=>`${i+1}. ${e.text}｜${e.owner||'未指定'}｜${e.due||'無期限'}`).join('\n')+'\n';
 return s}
function compileDlg(){const m=D.meetings.find(x=>x.id===curMeeting);const t=compileMeeting(m);window._mt=t;
 openModal(`<h2>整合會議記錄</h2><div class="pre card" style="font-size:14px">${h(t)}</div>
 <div class="actions"><button class="blue" onclick="copy(window._mt)">複製</button><button onclick="window.print()">🖨 列印</button>
 <button class="ghost" onclick="copy('請把以下教會兒童主日學同工會的會議紀錄整理成通順、條理清楚的正式會議記錄，保留所有決議與待辦（負責人與期限），不要增加原文沒有的內容：\\n\\n'+window._mt)">複製給 Claude 整理</button></div>`)}

 <label class="f">目前密碼<input id="mp_o" type="password"></label><label class="f">新密碼（至少 6 碼）<input id="mp_n" type="password"></label><label class="f">再輸入一次<input id="mp_n2" type="password"></label>

 if(authOn()&&!isAdmin())return `<h2>設定</h2>${myAccount()}<div class="card"><h3>資料備份</h3><button onclick="exportAll()">⬇ 匯出備份</button></div><p class="muted">系統設定與老師帳號由主控管理。</p>`;
 const now=Date.now();const open=D.invites.filter(i=>!i.usedBy&&!i.revoked&&i.expires>now);const used=D.invites.filter(i=>i.usedBy).slice(-5).reverse();

 return `<h2>設定${authOn()?'（'+roleName(me())+'）':''}</h2>${authCard}${cloudCard}${authOn()?`
 ${pendingCard()}<div class="card"><h3>👥 老師帳號</h3><table>${D.teachers.filter(t=>!t.pending).map(t=>`<tr style="${t.active===false?'opacity:.5':''}"><td><b>${h(t.name)}</b> <span class="tag ${isAdminRole(t.role)?'t':'o'}">${roleName(t)}</span> ${accOf(t)!==t.name?`<span class="muted">帳號：${h(accOf(t))}</span>`:''}${t.active===false?' <span class="tag">已停用</span>':''}<div class="muted">${h(t.created||'')} 加入</div></td>
 <td style="text-align:right">${t.name===user?'<span class="muted">（你）</span>':!canManage(t)?'<span class="muted">🔒 只有設計師能修改</span>':`<button class="sm ghost" onclick="resetPw('${t.id}')">重設密碼</button> <select class="sm" style="padding:4px" onchange="setRole('${t.id}',this.value)">${Object.keys(ROLES).filter(r=>r!=='designer'||amDesigner()).map(r=>`<option value="${r}" ${(t.role||'teacher')===r?'selected':''}>${ROLES[r]}</option>`).join('')}</select> <button class="sm ${t.active===false?'ghost':'danger'}" onclick="toggleT('${t.id}')">${t.active===false?'啟用':'停用'}</button> <button class="sm danger" title="刪除這個帳號" onclick="delT('${t.id}')">🗑 刪除</button>`}</td></tr>`).join('')}</table>
 <p class="muted">停用的老師不能再登入，但過去寫的紀錄都會保留。目前可管理的帳號（主控＋設計師）${admins} 位，建議至少兩位，避免忘記密碼時沒人能管理。<br>身分說明：主控＝負責同工／院長；設計師＝負責 app 程式；兩者都能管理帳號與設定。老師＝備課、上課、點名、紀錄、會議。</p></div>
`:''}
 <div class="card"><h3>⭐ 點數與教學設定</h3><label class="f">名稱<input id="st_c" value="${h(S.church)}"></label>
 <label class="f">① 主日學規則（一行一條，上課時大家一起念）<textarea id="st_rules">${h((S.rules||[]).join('\n'))}</textarea></label>
 <label class="f">① 參加主日學的原因（一行一條，顯示在規則下面）<textarea id="st_reasons">${h((S.reasons||[]).join('\n'))}</textarea></label>
 ${authOn()?'':`<label class="f">老師名單（一行一位，用於上課紀錄與會議）<textarea id="st_tn">${h((S.teacherNames||[]).join('\n'))}</textarea></label>`}
 ${authOn()?`<label class="f"><input type="checkbox" id="st_r" ${S.requireLogin?'checked':''}> 教學模式點名加點需要老師登入</label>`:''}
 <div class="row"><label class="f">報到截止時間<input id="st_cut" type="time" value="${h(S.cutoff)}"></label><label class="f">準時報到點數<input id="st_on" type="number" value="${S.onPts}"></label><label class="f">晚到報到點數<input id="st_late" type="number" value="${S.latePts}"></label></div><label class="f">每日點數上限（每個孩子一天最多得幾點，0＝不限）<input id="st_cap" type="number" min="0" value="${S.dailyCap||0}"></label><p class="muted">準時與晚到不重複計算；其他項目每人每天各算一次。補登舊點數、扣點、兌換不受上限影響。</p>
 <label class="f">其他加分項目（一行一個：名稱 | 點數）<textarea id="st_i">${h(S.items.map(i=>i.name+' | '+i.pts).join('\n'))}</textarea></label>
 <label class="f">獎勵（一行一個：名稱 | 所需點數）<textarea id="st_w">${h(S.rewards.map(i=>i.name+' | '+i.cost).join('\n'))}</textarea></label>
 <div class="actions"><button class="blue" onclick="saveSettings()">儲存設定</button></div></div>
 ${authOn()?myAccount():''}

 <div class="card"><h3>最近異動</h3><table>${D.log.slice(0,30).map(l=>`<tr><td class="muted" style="white-space:nowrap">${h(l.ts)}</td><td>${h(l.by)}</td><td>${h(l.act)}</td></tr>`).join('')||'<tr><td class="muted">無</td></tr>'}</table></div>`}
function enableAuth(){if(needCloud())return;if(!confirm('啟用老師帳號？之後進老師區需要登入，所有裝置都會套用。（可以隨時關閉）'))return;if(!D.teachers.some(t=>isAdminRole(t.role)))return setupDlg();D.settings.auth=true;setUser(null);save('啟用老師帳號登入');setMode('teach');loginDlg()}
function genInvite(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c;do{c=[...Array(6)].map(()=>A[Math.floor(Math.random()*A.length)]).join('')}while(D.invites.some(i=>i.code===c));
 D.invites.push({code:c,note:val('iv_note'),by:user,created:today(),expires:Date.now()+7*864e5});save('產生驗證碼 '+c);render();copyInvite(c)}
function copyInvite(c){const i=D.invites.find(x=>x.code===c);copy(`🐑 小羊樂園 老師註冊驗證碼：${c}\n打開小羊樂園 app → 老師登入 → 用驗證碼註冊。\n驗證碼限用一次，${new Date(i.expires).toLocaleDateString('zh-TW')} 前有效。`)}

/* 刪除帳號（例如測試帳號）：過去紀錄上的名字會保留；不能刪自己，也要保留至少一位主控或設計師 */
/* 設計師身分保護：只有設計師能修改設計師（主控不能改設計師的身分、停用、刪除或重設密碼，也不能把人設成設計師） */
const amDesigner=()=>!authOn()||(me()||{}).role==='designer';
function canManage(t){return amDesigner()||t.role!=='designer'}
function guardT(t){if(t&&!canManage(t)){toast('設計師的帳號只有設計師能修改');render();return false}return !!t}
function delT(id){const t=D.teachers.find(x=>x.id===id);if(!guardT(t))return;

 if(t.active!==false&&lastAdmin(t)){toast('至少要保留一位主控或設計師');return}
 if(!confirm('永久刪除「'+t.name+'」（帳號：'+accOf(t)+'）？\n刪除後不能再用這個帳號登入；過去紀錄上的名字會保留。\n只是暫時不讓他登入的話，請用「停用」。'))return;
 D.teachers=D.teachers.filter(x=>x.id!==id);save('刪除老師帳號 '+t.name);render();toast('已刪除 '+t.name)}
function toggleT(id){const t=D.teachers.find(x=>x.id===id);if(!guardT(t))return;if(t.active!==false&&lastAdmin(t)){toast('至少要保留一位主控或設計師');return}t.active=t.active===false;save((t.active?'啟用':'停用')+'老師 '+t.name);render()}
function setRole(id,r){const t=D.teachers.find(x=>x.id===id);if(!guardT(t))return;if(r==='designer'&&!amDesigner()){toast('只有設計師能把人設成設計師');render();return}if(!isAdminRole(r)&&lastAdmin(t)){toast('至少要保留一位主控或設計師');render();return}t.role=r;save(t.name+' 改為'+ROLES[r]);render();toast(t.name+' 改為'+ROLES[r])}
async function resetPw(id){const t=D.teachers.find(x=>x.id===id);if(!guardT(t))return;const p=prompt(`替「${t.name}」設定臨時密碼（至少 6 碼），請對方登入後自己修改`);if(p===null)return;
 if(p.length<6){toast('密碼至少 6 碼');return}t.pwHash=await hashPw(p);save('重設 '+t.name+' 的密碼');toast('已重設')}
function saveSettings(){const v=k=>document.getElementById(k).value;const S=D.settings;
 S.church=v('st_c').trim()||'小羊樂園';S.rules=v('st_rules').split('\n').map(x=>x.trim()).filter(Boolean);S.reasons=v('st_reasons').split('\n').map(x=>x.trim()).filter(Boolean);const r=document.getElementById('st_r');if(r)S.requireLogin=r.checked;const tn=document.getElementById('st_tn');if(tn)S.teacherNames=tn.value.split('\n').map(x=>x.trim()).filter(Boolean);S.cutoff=v('st_cut')||'10:30';S.onPts=Number(v('st_on'))||2;S.latePts=Number(v('st_late'))||1;
 S.dailyCap=Math.max(0,Number(v('st_cap'))||0);S.items=pairs(v('st_i').split('\n')).map(p=>({name:p[0],pts:Number(p[1])||1}));
 S.rewards=pairs(v('st_w').split('\n')).map(p=>({name:p[0],cost:Number(p[1])||1}));
 save('修改設定');render();toast('設定已儲存')}

async function importAll(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!d.settings)throw Error('格式不符');if(!confirm('用備份檔取代目前所有資料？'))return;D=d;save('匯入備份');render();toast('已匯入')}catch(e){toast('匯入失敗：'+e.message)}}

document.addEventListener('keydown',e=>{
 if(mode!=='teach'||document.getElementById('modal').classList.contains('on'))return;
 const ae=document.activeElement,t=ae&&ae.tagName;
 const nav=['ArrowRight','PageDown','ArrowLeft','PageUp'].indexOf(e.key)>=0;
 if(t==='SELECT'&&ae.closest('#hdr')&&nav&&(e.key==='PageDown'||e.key==='PageUp'||e.key==='ArrowRight'||e.key==='ArrowLeft'))ae.blur();  // 上方選單選完課後，方向鍵照樣換頁
 else if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
 if(e.key==='ArrowRight'||e.key==='PageDown'){stepGo(1);e.preventDefault()}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){stepGo(-1);e.preventDefault()}
 else if(/^[1-8]$/.test(e.key)){go(STEPS[Number(e.key)-1][0])}
});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
render();
/* ===== 開場動畫：打開 app 時先播放（按「重新整理」回來時不播） ===== */
(function(){if(VIEW0)return;
 const o=document.createElement('div');o.id='intro';
 o.innerHTML='<div class="ibg"></div><video id="introV" src="assets/intro.mp4" playsinline preload="auto"></video><button id="introSnd" type="button">🔊 開聲音</button><button id="introSkip" type="button">跳過 ›</button>';
 document.body.appendChild(o);const v=o.querySelector('video'),snd=o.querySelector('#introSnd');let done=false;
 const end=()=>{if(done)return;done=true;o.style.opacity='0';setTimeout(()=>{try{v.pause()}catch(e){}o.remove()},650)};
 const unmute=()=>{v.muted=false;snd.style.display='none';const r=v.play();if(r&&r.catch)r.catch(()=>{})};
 snd.onclick=e=>{e.stopPropagation();unmute()};
 o.querySelector('#introSkip').onclick=e=>{e.stopPropagation();end()};
 v.onclick=()=>{if(v.muted)unmute()};
 v.onended=()=>setTimeout(end,700);v.onerror=end;setTimeout(end,16000);
 const p=v.play();   // 先試著有聲播放；瀏覽器擋下來就改靜音播放，並顯示「開聲音」按鈕
 if(p&&p.then)p.then(()=>{snd.style.display='none'},()=>{v.muted=true;const q=v.play();if(q&&q.catch)q.catch(end)});
 else snd.style.display='none';
})();
cloudStart();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
/* 重新整理：安裝成 App 後沒有瀏覽器的重新整理鍵，所以在上方放一顆；會先更新程式、清掉舊快取，再載入最新版 */
async function hardReload(){toast('🔄 正在載入最新版…');try{sessionStorage.setItem('llm_view',JSON.stringify({mode,tab,lesson:curLesson}))}catch(e){}
 try{if(Cloud&&Cloud.pw&&cloudDirty().length){cloudTick();await new Promise(r=>setTimeout(r,2000))}}catch(e){}  // 還沒上傳的修改先送出
 try{if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.update().catch(()=>{})))}}catch(e){}
 try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}
 try{await fetch('./index.html?r='+Date.now(),{cache:'reload'})}catch(e){}
 location.replace(location.pathname+'?r='+Date.now()+location.hash)}
</script>
