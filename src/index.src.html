<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>小羊樂園 Little Lambs Meadow</title>
<style>
:root{--bg:#f7f3ec;--card:#fff;--ink:#2b2622;--muted:#7a7068;--pri:#e2572a;--soft:#fde8df;--blue:#2a6fd6;--bsoft:#e3eefc;--ok:#2e9b5a;--warn:#c9711c;--wsoft:#fff1df;--line:#e6ddd0}
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-tap-highlight-color:transparent}
header{color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0002}
header.teach{background:linear-gradient(135deg,#e2572a,#f2a128)}
header.staff{background:linear-gradient(135deg,#2a5bd6,#3f8fe0)}
.hrow{display:flex;gap:8px;align-items:center;justify-content:space-between;max-width:1400px;margin:auto;padding:10px 16px 4px}
header h1{margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.who button{white-space:nowrap}
@media(max-width:480px){.uname{display:none}}
.who{font-size:13px;display:flex;gap:6px;align-items:center;flex-shrink:0;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;max-width:1400px;margin:auto;padding:4px 12px 8px}
nav button{background:#ffffff26;color:#fff;white-space:nowrap}
nav button.on{background:#fff;color:var(--ink);font-weight:700}
button{font:inherit;font-size:14px;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;background:#fff;color:var(--ink)}
button.pri{background:var(--pri);color:#fff}
button.blue{background:var(--blue);color:#fff}
button.ghost{background:transparent;border:1px solid var(--line)}
button.danger{color:#c33;border:1px solid #f0c4c4;background:#fff}
button.sm{padding:4px 9px;font-size:13px}
button:disabled{opacity:.4;cursor:not-allowed}
main{max-width:1100px;margin:auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted);font-size:13px}
h2{margin:0 0 6px;font-size:20px}
h3{margin:0 0 6px;font-size:16px}
.sec{margin-top:14px}
.sec h4{margin:0 0 4px;font-size:14px;color:var(--pri);border-left:4px solid var(--pri);padding-left:8px}
.sec ol,.sec ul{margin:4px 0;padding-left:22px}
.pre{white-space:pre-wrap}
.video{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000}
.video:fullscreen{padding-top:0!important;border-radius:0;width:100%!important;height:100%!important}.video:-webkit-full-screen{padding-top:0!important;border-radius:0;width:100%!important;height:100%!important}
.video img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.video .play{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(226,87,42,.9);color:#fff;font-size:38px;line-height:84px;text-align:center;pointer-events:none}
.video{cursor:pointer}
.video iframe{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;border:0}
select,input,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff}
label.f{display:block;margin-top:10px;font-size:13px;color:var(--muted)}
label.f>input:not([type=checkbox]),label.f>textarea,label.f>select{display:block;width:100%;margin-top:3px}
textarea{min-height:70px;resize:vertical;width:100%}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.checks label{background:#f4f1ec;border-radius:16px;padding:3px 10px;color:var(--ink);font-size:14px}
.tag{display:inline-block;font-size:12px;border-radius:10px;padding:1px 8px;background:#eee;color:#555}
.tag.d{background:#e2f5ea;color:var(--ok)}.tag.t{background:var(--wsoft);color:var(--warn)}.tag.o{background:var(--bsoft);color:var(--blue)}
.flag{color:var(--warn);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
/* 投影 */
.proj{background:#1f1b2e;color:#fff;border-radius:16px;padding:28px 20px;text-align:center;min-height:260px;display:flex;flex-direction:column;justify-content:center}
.proj .ref{color:#f2c46b;font-size:18px;margin-top:14px}
.proj .zh{font-size:34px;font-size:clamp(24px,5vw,44px);font-weight:700;line-height:1.5}
.proj .en{font-size:24px;font-size:clamp(18px,3.4vw,30px);margin-top:12px;color:#d8d4ee}
.tok{cursor:pointer;border-radius:4px}
.tok.hid{background:#f2c46b;color:transparent;user-select:none}
.lyrics{background:#1f1b2e;color:#fff;border-radius:16px;padding:24px;white-space:pre-wrap;text-align:center;line-height:1.8}
/* 點名 */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.kid{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;user-select:none;transition:transform .1s}
.kid:active{transform:scale(.95)}
.kid .n{font-size:18px;font-weight:700}
.kid .p{font-size:13px;color:var(--muted)}
.kid.here{border-color:var(--ok);background:#effaf3}
.kid.here.late{border-color:var(--warn);background:var(--wsoft)}
.kid.got{box-shadow:0 0 0 3px var(--pri) inset}
.kid.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.12);background:#fff4c2}}
.items{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.items button{border:2px solid var(--line)}
.items button.on{border-color:var(--pri);background:var(--soft);font-weight:700}
.rank li{font-size:20px;padding:6px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between}
.rank{list-style:none;padding:0;margin:0}
.rank li b{color:var(--pri)}
.medal{width:1.7em;display:inline-block}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:#0006;display:none;align-items:flex-start;justify-content:center;z-index:30;overflow-y:auto;padding:20px 10px}
.modal.on{display:flex}
.panel{background:#fff;border-radius:14px;max-width:720px;width:100%;padding:18px;position:relative}
.close{position:absolute;top:10px;right:10px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2622;color:#fff;padding:8px 16px;border-radius:20px;z-index:40;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.entry{border-left:3px solid var(--line);padding:4px 10px;margin:6px 0}
.entry.決議{border-color:var(--ok)}.entry.待辦{border-color:var(--warn)}
.stage{font-size:22px;line-height:1.7}
.stage h2{font-size:28px}
.bigcard{background:#1f1b2e;color:#fff;border-radius:16px;padding:26px 24px;font-size:26px;line-height:1.7}
.bigcard ol{margin:0;padding-left:1.4em}.bigcard li{margin:6px 0}
.steptitle{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.steptitle .num{width:44px;height:44px;border-radius:50%;background:var(--pri);color:#fff;font-size:22px;font-weight:700;text-align:center;line-height:44px;flex-shrink:0}
.steptitle h2{margin:0;font-size:28px}
.stepnav{display:flex;gap:10px;margin-top:18px}
.stepnav button{flex:1;font-size:18px;padding:14px 10px}
.lbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:14px;color:var(--muted)}
.lbar select{flex:1;padding:6px}
.qcard{background:#fff;border:3px solid var(--pri);border-radius:16px;padding:30px 24px;font-size:30px;font-weight:700;text-align:center;min-height:180px}
nav button .n{display:inline-block;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.35);font-size:12px;line-height:20px;text-align:center;margin-right:4px}
nav button.on .n{background:var(--pri);color:#fff}
main.teach{max-width:none;padding:10px 16px;overflow:hidden}
main.teach>.stage{max-width:1400px;margin:0 auto}
.stage{display:flex;flex-direction:column;height:100%;min-height:0}
.stephead{display:flex;align-items:center;margin-bottom:8px;flex-shrink:0}
.stephead .num{width:40px;height:40px;border-radius:50%;background:var(--pri);color:#fff;font-size:20px;font-weight:700;text-align:center;line-height:40px;flex-shrink:0;margin-right:10px}
.stephead h2{margin:0;font-size:26px;white-space:nowrap}
.lsel{max-width:50%;padding:6px;font-size:14px;margin-left:10px}
.fill{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.fill>.fit,.fill>.vwrap{flex:1;min-height:0;overflow:hidden}
.vwrap .video{margin:0 auto}
.tbar{flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tbar>*{margin:0 6px 6px 0}
.fit{overflow:hidden}
.bigcard.fit{display:flex;flex-direction:column;justify-content:center}
.proj.fit{min-height:0;padding:16px}
.proj .zh{font-size:1em!important}.proj .en{font-size:.62em!important}.proj .ref{font-size:.45em!important}
.qcard.fit{display:flex;align-items:center;justify-content:center;min-height:0}
.kidsfit .kids{grid-template-columns:repeat(auto-fill,minmax(6.5em,1fr))}
.kidsfit .kid{padding:.5em .3em}.kidsfit .kid .n{font-size:1em}.kidsfit .kid .p{font-size:.7em}
.rank.fit li{font-size:1em}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.notice{background:var(--wsoft);border-radius:10px;padding:10px 12px;font-size:14px}
a{color:var(--blue)}
@media print{header,main,.actions,.close,.noprint{display:none!important}.modal{position:static;display:block!important;background:none;padding:0}.panel{max-width:none}}
</style>
</head>

<script>

<script>
/* ============ 資料層（之後換成 Google 試算表 / Firebase 只需改這裡） ============ */
const DEFAULT_RULES=['上課時專心聽老師說話','想說話先舉手','愛護身邊的朋友，不推、不打、不罵人','愛惜教室和教材，用完放回原位','一起敬拜、一起學習神的話'];
const DEFAULT_PRAYER='親愛的天父，謝謝祢今天帶領我們一起學習祢的話語。求祢幫助每一位小朋友把今天學到的放在心裡，這一週平平安安。奉主耶穌基督的名禱告，阿們。';

const KEY='little_lambs_meadow_v1';

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const DB={
 load(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&d.settings)return DB.fix(d)}}catch(e){}return demo()},
 fix(d){{{d.invites=d.invites||[];(d.log||[]).forEach(l=>{if(!l.id){l.id=uid();l.t=l.t||0}});if(d.settings.auth===undefined)d.settings.auth=false;if(!d.settings.rules)d.settings.rules=DEFAULT_RULES.slice();if(!d.settings.prayer)d.settings.prayer=DEFAULT_PRAYER;if(!d.settings.cutoff){d.settings.cutoff='10:30';d.settings.onPts=2;d.settings.latePts=1}if((d.settings.items||[]).map(x=>x.name).join()==='背金句,帶聖經,幫忙收拾,熱心參與')d.settings.items=DEFAULT_ITEMS.map(x=>Object.assign({},x));const dm=demo();(d.lessons||[]).forEach(l=>{const x=dm.lessons.find(y=>y.title===l.title&&y.video===l.video);if(x){['intro','iceName','prayer'].forEach(k=>{if(!l[k])l[k]=x[k]})}});(d.songs||[]).forEach(sg=>{if(sg.title==='（示範）本季主題詩歌'&&sg.theme===undefined)sg.theme=true});d.settings.teacherNames=d.settings.teacherNames||['王老師','李老師'];d.teachers=(d.teachers||[]).filter(t=>t.pwHash);return d}}},
 save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){toast('無法儲存，請用「設定 → 匯出備份」')}}
};
function demo(){
 const k=['小明','小美','小恩','小約翰'].map(n=>({id:uid(),name:n,group:'',active:true,flag:false,flagNote:''}));
 return {
  settings:{church:'小羊樂園',rules:DEFAULT_RULES.slice(),prayer:DEFAULT_PRAYER,auth:false,teacherNames:['王老師','李老師'],requireLogin:false,cutoff:'10:30',onPts:2,latePts:1,
   items:DEFAULT_ITEMS.map(x=>Object.assign({},x)),
   rewards:[{name:'貼紙',cost:5},{name:'文具',cost:15},{name:'小禮物',cost:30}]},
  teachers:[],invites:[],
  lessons:[
   {id:uid(),season:'第一季',no:1,date:'2026-11-01',title:'世界的開始',scripture:'創世記 1–3 章',
    video:'https://www.youtube.com/watch?v=j8lHcRzyIHY',
    iceName:'黑暗與光的創造之旅',intro:'今天我們要跟著超級妙妙書的主角們，一起穿越時空回到「起初」——世界還沒有開始的時候！\n看影片時請注意：神創造了哪些東西？神每天創造完以後說了什麼？',prayer:'親愛的天父，謝謝祢創造了這麼美麗的世界，也謝謝祢創造了我。求祢幫助我每天都記得，我是祢特別的作品。奉主耶穌基督的名禱告，阿們。',story:'神用說話創造了光、天空、海洋、植物、動物，最後照著自己的形像造人，並在第七天安息。神看著一切都「甚好」。\n重點：世界不是偶然出現的，是神用愛精心創造的，每個孩子都是神特別的作品。',
    expSteps:['（5分）黑暗開場：關燈，只說「起初，地是空虛混沌」，停十秒讓孩子感受黑暗','（3分）要有光：老師說「要有光！」同時打開燈或手電筒，問孩子剛才的感受','（10分）創造感官站：分組輪流摸水（海）、泥土（地）、樹葉（植物）、毛絨玩具（動物）','（10分）我是神的作品：每人用黏土捏一個「神造的東西」，介紹給大家','（3分）第七天安息：全體躺下或趴下，安靜一分鐘，感謝神'],
    props:['手電筒數支','臉盆裝水、毛巾','一盒泥土或沙','樹葉、花','毛絨動物玩具','黏土（每人一份）'],
    safety:'關燈時保留一盞小夜燈；玩水區鋪報紙並準備毛巾。',
    questions:['神創造的東西裡，你最喜歡哪一個？為什麼？','神說人是照著祂的形像造的，這代表什麼？','你覺得神看見你的時候，會說什麼？'],
    verseRef:'創世記 1:1',verseZh:'起初，神創造天地。',verseEn:'In the beginning God created the heaven and the earth.',
    songIds:[],notes:'【示範課程】影片約 25 分鐘，可只播前半段再進體驗活動。'}
  ],
  songs:[{id:uid(),title:'（示範）本季主題詩歌',season:'第一季',theme:true,video:'',lyrics:'在「老師區 → 詩歌」貼上教會使用的歌詞版本，\n上課時就能在這裡投影。\n\n可以用 A− / A＋ 調整字體大小，\n按 ⛶ 全螢幕投影。',notes:'動作：副歌時大家拍手兩下'}],
  shows:[{id:uid(),season:'第一季',date:'2026-12-20',title:'第一季成果發表（示範）',items:[['開場詩歌','全體小朋友','5'],['金句背誦：創世記 1:1（中英）','全體小朋友','3'],['短劇：七天的創造','國小組','8'],['結尾詩歌與禱告','全體','5']],tasks:[{t:'訂主堂場地',o:'王老師',done:true},{t:'短劇道具：太陽月亮星星頭飾',o:'李老師',done:false},{t:'邀請家長的通知單',o:'王老師',done:false}],notes:'彩排：12/13 主日學後'}],kids:k,ledger:[],attend:{},sessions:[],meetings:[],log:[]
 };
}
let D=DB.load();
let myName='';try{myName=sessionStorage.getItem('ss_name')||''}catch(e){}
function who(){return user||(mode==='staff'?(myName||'老師'):'教學模式')}
function save(act){if(act){D.log.unshift({id:uid(),t:Date.now(),ts:new Date().toLocaleString('zh-TW'),by:who(),act});D.log=D.log.slice(0,300)}DB.save(D);cloudSoon()}
/* ============ 雲端同步（Google 試算表） ============ */
const CLOUD_URL_DEFAULT='https://script.google.com/macros/s/AKfycby5cqFp80G1Cdg6EYMbmY40zP1wckca4k2dFedeQ0dJ1bSQLbZS-gqY6qRGGUR0geiaRw/exec';
const CK='llm_cloud_v1';
const Cloud={url:'',pw:'',ver:0,base:{},snap:{},busy:false,state:'off',lastOk:0,needRebuild:false,needRender:false,skip:false,t2:null};
(function(){let c={};try{c=JSON.parse(localStorage.getItem(CK)||'{}')}catch(e){}
 Cloud.url=c.url||CLOUD_URL_DEFAULT;Cloud.pw=c.pw||'';Cloud.ver=c.ver||0;Cloud.base=c.base||{};Cloud.snap=Object.assign({},Cloud.base);Cloud.skip=!!c.skip})();
function cloudPersist(){try{localStorage.setItem(CK,JSON.stringify({url:Cloud.url,pw:Cloud.pw,ver:Cloud.bver||Cloud.ver,base:Cloud.base,skip:Cloud.skip}))}catch(e){}}
const COLS=['teachers','invites','lessons','songs','shows','kids','ledger','sessions','log'];
function toRecs(d){const r={};r['settings/main']=JSON.stringify(d.settings);
 COLS.forEach(c=>(d[c]||[]).forEach(x=>{const id=c==='invites'?x.code:x.id;if(id)r[c+'/'+id]=JSON.stringify(x)}));
 (d.meetings||[]).forEach(m=>{const o=Object.assign({},m);delete o.entries;r['meetings/'+m.id]=JSON.stringify(o);
  (m.entries||[]).forEach(e=>{r['mentries/'+e.id]=JSON.stringify(Object.assign({mid:m.id},e))})});
 Object.keys(d.attend||{}).forEach(dt=>Object.keys(d.attend[dt]).forEach(k=>{r['attend/'+dt+'|'+k]=JSON.stringify({d:dt,k:k,lid:d.attend[dt][k]})}));
 return r}
function fromRecs(r){const d={settings:null,meetings:[],attend:{}};COLS.forEach(c=>d[c]=[]);const ents=[];
 Object.keys(r).forEach(k=>{const c=k.slice(0,k.indexOf('/'));let v;try{v=JSON.parse(r[k])}catch(e){return}
  if(c==='settings')d.settings=v;else if(c==='meetings'){v.entries=[];d.meetings.push(v)}else if(c==='mentries')ents.push(v);
  else if(c==='attend')(d.attend[v.d]=d.attend[v.d]||{})[v.k]=v.lid;else if(d[c])d[c].push(v)});
 ents.sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(e=>{const m=d.meetings.find(x=>x.id===e.mid);if(m){const o=Object.assign({},e);delete o.mid;m.entries.push(o)}});
 d.log.sort((a,b)=>(b.t||0)-(a.t||0));d.log=d.log.slice(0,300);
 if(!d.settings)d.settings=demo().settings;
 return DB.fix(d)}
function cloudDirty(){const L=toRecs(D),B=Cloud.base,out=[];
 Object.keys(L).forEach(k=>{if(L[k]!==B[k])out.push({k,j:L[k]})});
 Object.keys(B).forEach(k=>{if(!(k in L))out.push({k,j:null})});return out}
function cloudPost(body){
 const ctl=window.AbortController?new AbortController():null;const tm=setTimeout(()=>ctl&&ctl.abort(),20000);
 return fetch(Cloud.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ctl?ctl.signal:undefined})
  .then(r=>r.json()).then(j=>{clearTimeout(tm);return j},e=>{clearTimeout(tm);throw e})}

 dirty.forEach(x=>{if(x.j===null)delete m[x.k];else m[x.k]=x.j});
 D=fromRecs(m);DB.save(D);Cloud.base=Object.assign({},Cloud.snap);Cloud.bver=Cloud.ver;Cloud.needRebuild=false;cloudPersist();cloudRender()}

 const ae=document.activeElement,fid=ae&&ae.id&&ae.closest&&ae.closest('#app')?ae.id:null,sel=fid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
 render();

function cloudTick(){
 if(!Cloud.url||!Cloud.pw||Cloud.busy)return;
 const first=!Cloud.pulled&&!Cloud.ver&&!Object.keys(Cloud.base).length;
 const recs=first?[]:cloudDirty();
 if(document.hidden&&!recs.length)return;
 Cloud.busy=true;if(recs.length)Cloud.state='saving';cloudBadgeUpdate();
 cloudPost({op:'sync',pw:Cloud.pw,since:Cloud.ver,recs:recs,by:who()}).then(res=>{
  Cloud.busy=false;
  if(!res.ok){if(res.err==='pw'){Cloud.pw='';Cloud.state='pw';cloudPersist();cloudBadgeUpdate();cloudPwDlg(false)}else if(res.err==='noinit'){Cloud.state='pw';cloudPwDlg(true)}else{Cloud.state='err';cloudBadgeUpdate()}return}
  Cloud.state='ok';Cloud.lastOk=Date.now();
  recs.forEach(x=>{if(x.j===null){delete Cloud.snap[x.k];delete Cloud.base[x.k]}else{Cloud.snap[x.k]=x.j;Cloud.base[x.k]=x.j}});
  let changed=false;
  (res.recs||[]).forEach(x=>{if(x.j===null){if(x.k in Cloud.snap){delete Cloud.snap[x.k];changed=true}}else if(Cloud.snap[x.k]!==x.j){Cloud.snap[x.k]=x.j;changed=true}});
  Cloud.ver=res.ver;Cloud.pulled=true;
  if(first){
   if(Object.keys(Cloud.snap).length){try{localStorage.setItem('llm_local_backup',JSON.stringify(D))}catch(e){}Cloud.base={};D=fromRecs(Cloud.snap);DB.save(D);Cloud.base=Object.assign({},Cloud.snap);Cloud.bver=Cloud.ver;cloudPersist();cloudRender();toast('☁️ 已從雲端載入資料')}
   else{Cloud.bver=0;cloudPersist();toast('☁️ 第一次連線，正在上傳這台裝置的資料');setTimeout(cloudTick,50)}
   return}
  if(changed){if(cloudSafe())cloudRebuild();else Cloud.needRebuild=true}
  else{if(!recs.length&&!Cloud.needRebuild){Cloud.bver=Cloud.ver}cloudPersist()}
  cloudBadgeUpdate();
 },()=>{Cloud.busy=false;Cloud.state='off';cloudBadgeUpdate()});
}

function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ===== YouTube：單支影片、播放清單、多首連續播放 ===== */
const YTMAP={};
function ytReg(key,src,thumb,watch){YTMAP[key]={src,thumb,watch};return key}
function ytId(u){u=String(u||'');
 const v=(u.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([\w-]{11})/)||[])[1];
 const l=(u.match(/[?&]list=([\w-]+)/)||[])[1];
 if(!v&&!l)return null;
 const key=(v||'L')+(l?'_'+l.slice(-10):'');
 return ytReg(key,v?'https://www.youtube.com/embed/'+v+(l?'?list='+l:''):'https://www.youtube.com/embed/videoseries?list='+l,
  v?'https://i.ytimg.com/vi/'+v+'/hqdefault.jpg':'',v?'https://www.youtube.com/watch?v='+v+(l?'&list='+l:''):'https://www.youtube.com/playlist?list='+l)}
function ytQueue(ids){if(!ids.length)return null;const key='Q_'+ids.join('').slice(0,40);
 return ytReg(key,'https://www.youtube.com/embed/'+ids[0]+(ids.length>1?'?playlist='+ids.slice(1).join(','):''),'https://i.ytimg.com/vi/'+ids[0]+'/hqdefault.jpg','https://www.youtube.com/watch_videos?video_ids='+ids.join(','))}
function ytBox(key){const y=YTMAP[key]||{};
 return `<div class="video" id="vid_${key}" onclick="playInline('${key}')">${y.thumb?`<img src="${y.thumb}" alt="">`:'<div style="position:absolute;top:0;left:0;right:0;bottom:0;background:#1f1b2e"></div>'}<div class="play">▶</div></div>`}
function ytSrc(key){const s=YTMAP[key].src;return s+(s.indexOf('?')>=0?'&':'?')+'autoplay=1&rel=0'}
function ensureFrame(key){const box=document.getElementById('vid_'+key);let f=box.querySelector('iframe');
 if(!f){box.innerHTML='<iframe allow="autoplay; fullscreen" allowfullscreen></iframe>';f=box.querySelector('iframe');box.onclick=null}return f}
function playInline(key){ensureFrame(key).src=ytSrc(key)}
function playFull(key,srcKey){
 srcKey=srcKey||key;const box=document.getElementById('vid_'+key);
 const fs=box&&(box.requestFullscreen||box.webkitRequestFullscreen);
 if(!fs){window.open(YTMAP[srcKey].watch,'_blank');return}   // iPhone 不支援網頁全螢幕 → 交給 YouTube App
 const f=ensureFrame(key);
 try{const r=fs.call(box);r&&r.catch&&r.catch(()=>{})}catch(e){}
 f.src=ytSrc(srcKey);
}

let FORM=null;
function form(title,fields,obj,onSave,extra=''){
 FORM={fields,onSave};
 openModal(`<h2>${title}</h2>${fields.map(f=>fieldHtml(f,obj)).join('')}${extra}
  <div class="actions"><button class="pri" onclick="submitForm()">儲存</button><button class="ghost" onclick="closeModal()">取消</button></div>`);
}
function fieldHtml([k,label,type='text',opts],o){
 const v=o[k];const id='f_'+k;
 if(type==='textarea')return `<label class="f">${label}<textarea id="${id}">${h(v)}</textarea></label>`;
 if(type==='lines')return `<label class="f">${label}<textarea id="${id}">${h((v||[]).join('\n'))}</textarea></label>`;
 if(type==='select')return `<label class="f">${label}<select id="${id}">${opts.map(([a,b])=>`<option value="${h(a)}" ${a===v?'selected':''}>${h(b)}</option>`).join('')}</select></label>`;
 if(type==='checks')return `<label class="f">${label}<div class="checks" id="${id}">${opts.map(n=>`<label><input type="checkbox" value="${h(n)}" ${(v||[]).includes(n)?'checked':''}> ${h(n)}</label>`).join('')}</div></label>`;
 if(type==='bool')return `<label class="f"><input type="checkbox" id="${id}" ${v?'checked':''}> ${label}</label>`;
 return `<label class="f">${label}<input id="${id}" type="${type}" value="${h(v)}"></label>`;
}
function submitForm(){
 const out={};
 for(const [k,,type] of FORM.fields){const e=document.getElementById('f_'+k);
  if(type==='lines')out[k]=e.value.split('\n').map(x=>x.trim()).filter(Boolean);
  else if(type==='checks')out[k]=[...e.querySelectorAll('input:checked')].map(x=>x.value);
  else if(type==='bool')out[k]=e.checked;
  else if(type==='number')out[k]=Number(e.value)||0;
  else out[k]=e.value.trim();}
 if(FORM.onSave(out)!==false){closeModal();render()}
}

async function hashPw(pw){const t=new TextEncoder().encode('xiaoyang|'+pw);
 try{const b=await crypto.subtle.digest('SHA-256',t);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
 catch(e){let a=5381,c=52711;for(const x of t){a=((a*33)^x)>>>0;c=((c*31)+x)>>>0}return 'f'+a.toString(16)+c.toString(16)}}

function logout(){setUser(null);setMode('teach')}

/* ============ 教學模式 ============ */
function lessonBody(l){
 if(!l)return '<div class="empty">還沒有課程，請老師登入後到「備課」新增或匯入</div>';
 const yt=ytId(l.video);const sec=(t,x)=>x?`<div class="sec"><h4>${t}</h4>${x}</div>`:'';
 const list=(a,tag)=>a&&a.length?`<${tag}>${a.map(x=>`<li>${linkify(x)}</li>`).join('')}</${tag}>`:'';
 const songs=(l.songIds||[]).map(id=>D.songs.find(s=>s.id===id)).filter(Boolean);
 return `<div class="muted">${h(l.season)} · 第 ${h(l.no)} 課${l.date?' · '+h(l.date):''}</div><h2>${h(l.title)}</h2>
  ${l.scripture?`<div class="muted">📜 ${h(l.scripture)}</div>`:''}
  ${yt?`<div class="sec"><h4>影片</h4><button class="pri" style="width:100%;font-size:17px;padding:12px;margin-bottom:8px" onclick="playFull('${yt}')">▶ 全螢幕播放</button>${ytBox(yt)}</div>`:sec('影片',l.video?`<a href="${h(l.video)}" target="_blank" rel="noopener">▶ 開啟影片</a>`:'')}
  ${sec('故事重點',l.story?`<div class="pre">${linkify(l.story)}</div>`:'')}
  ${sec('體驗活動流程',list(l.expSteps,'ol'))}
  ${sec('道具',list(l.props,'ul'))}
  ${sec('安全提醒',l.safety?`<div class="notice">${h(l.safety)}</div>`:'')}
  ${sec('討論問題',list(l.questions,'ol'))}
  ${sec('本課金句',l.verseZh||l.verseEn?`<div>${h(l.verseZh)}</div><div class="muted">${h(l.verseEn)}</div><div class="muted">${h(l.verseRef)}</div>`:'')}
  ${sec('本課詩歌',songs.map(s=>`<button class="sm ghost" onclick="curSong='${s.id}';go('worship')">🎵 ${h(s.title)}</button>`).join(' '))}`;
}
function lessonPicker(onchange){const l=lessonById(curLesson)||thisWeek();curLesson=l&&l.id;return D.lessons.length?`<select style="width:100%;margin-bottom:10px" onchange="curLesson=this.value;${onchange}render()">${lessonOpts(curLesson)}</select>`:''}
/* ===== 上課流程（每頁一個畫面，不用捲動） ===== */
let qIdx=0, qAll=false, showLyrics=false;
function stepIdx(){return STEPS.findIndex(x=>x[0]===tab)}
function stepGo(d){const i=stepIdx();if(i<0)return;const n=i+d;if(n>=0&&n<STEPS.length){qIdx=0;hidTok.clear();showLyrics=false;go(STEPS[n][0])}}
function cur(){const l=lessonById(curLesson)||thisWeek();curLesson=l&&l.id;return l||{}}
function lsel(){return D.lessons.length?`<select class="lsel" onchange="curLesson=this.value;qIdx=0;hidTok.clear();render()">${lessonOpts(curLesson)}</select>`:''}
function stepPage(body,needLesson){
 const i=stepIdx();const n=STEPS[i][1];const prev=STEPS[i-1],next=STEPS[i+1];const l=cur();
 return `<div class="stage"><div class="stephead"><div class="num">${i+1}</div><h2>${n}</h2><span class="sp"></span>${needLesson===false?'':lsel()}</div>
  <div class="fill">${needLesson!==false&&!l.id?'<div class="empty">還沒有課程，請老師到「老師區 → 備課」新增</div>':body}</div>
  <div class="stepnav">${prev?`<button class="ghost" onclick="stepGo(-1)">← ${prev[1]}</button>`:'<span style="flex:1"></span>'}${next?`<button class="pri" onclick="stepGo(1)">${next[1]} →</button>`:`<button class="pri" onclick="go('points')">⭐ 點名加點</button>`}</div></div>`}
function layout(){
 const m=document.getElementById('app');
 if(mode!=='teach'){m.className='';m.style.height='';document.body.style.overflow='';return}
 m.className='teach';document.body.style.overflow='hidden';
 m.style.height=Math.max(300,window.innerHeight-document.getElementById('hdr').offsetHeight)+'px';
 document.querySelectorAll('.vwrap').forEach(w=>{const v=w.querySelector('.video');if(!v)return;const W=w.clientWidth,H=w.clientHeight;const vw=Math.max(160,Math.min(W,H*16/9));v.style.width=vw+'px';v.style.height=(vw*9/16)+'px';v.style.paddingTop='0'});
 document.querySelectorAll('.fit').forEach(fitText);
}
function fitText(e){let f=Number(e.getAttribute('data-max'))||40;e.style.fontSize=f+'px';
 while(f>12&&(e.scrollHeight>e.clientHeight+1||e.scrollWidth>e.clientWidth+1)){f-=2;e.style.fontSize=f+'px'}}
window.addEventListener('resize',()=>{if(mode==='teach')layout()});
function tRules(){const r=D.settings.rules||[];
 return stepPage(`<div class="bigcard fit" data-max="44"><div style="color:#f2c46b;margin-bottom:.3em">🐑 小羊樂園的約定 —— 我們一起念一遍！</div><ol>${r.map(x=>`<li>${h(x)}</li>`).join('')}</ol></div>`,false)}
function worshipList(l){const ids=[];
 D.songs.filter(x=>x.theme&&(!l.season||x.season===l.season)).forEach(x=>ids.push(x.id));
 (l.songIds||[]).forEach(i=>{if(!ids.includes(i))ids.push(i)});
 return ids.map(i=>D.songs.find(x=>x.id===i)).filter(Boolean)}
function hasLyrics(s){return s.lyrics&&s.lyrics.trim()&&s.lyrics.indexOf('貼上教會使用的歌詞')<0}
function tWorship(){
 const l=cur();let list=worshipList(l);if(!list.length)list=D.songs.filter(x=>!l.season||x.season===l.season);
 const vids=list.map(x=>{const m=String(x.video||'').match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([\w-]{11})/);return m&&!/[?&]list=/.test(x.video)?m[1]:null}).filter(Boolean);
 const q=vids.length>1?ytQueue(vids):null;
 const s=list.find(x=>x.id===curSong)||list[0];if(s)curSong=s.id;const yt=s&&ytId(s.video);const box=yt||q;
 const bar=`<div class="tbar">${q?`<button class="pri" style="font-size:18px" onclick="playFull('${box}','${q}')">▶ 全部連續播放（${vids.length} 首）</button>`:''}
  ${list.map((x,i)=>`<button class="${x.id===s.id?'blue':'ghost'}" onclick="curSong='${x.id}';showLyrics=false;render()">${i+1}. ${x.theme?'⭐ ':''}${h(x.title)}</button>`).join('')}
  <span class="sp"></span>${yt?`<button class="pri" onclick="playFull('${yt}')">▶ 全螢幕播放這首</button>`:''}${s&&hasLyrics(s)?`<button class="ghost" onclick="showLyrics=!showLyrics;render()">${showLyrics?'🎬 看影片':'📝 歌詞'}</button>`:''}<button class="ghost" onclick="quickSongDlg()">＋ 加歌</button></div>`;
 if(!s)return stepPage(bar+'<div class="empty">這一課還沒有敬拜詩歌，按「＋ 加歌」貼上 YouTube 網址</div>');
 const main=showLyrics?`<div class="lyrics fit" data-max="40" id="lyr" style="padding:16px"><b>${h(s.title)}</b>\n${h(s.lyrics)}</div>`
  :box?`<div class="vwrap">${ytBox(box)}</div>`:s.video?`<div class="empty"><a href="${h(s.video)}" target="_blank" rel="noopener">▶ 開啟詩歌影片</a></div>`:'<div class="empty">這首詩歌還沒有 YouTube 網址，可以到「老師區 → 詩歌」補上</div>';
 return stepPage(bar+main)}
function quickSongDlg(){openModal(`<h2>＋ 加一首敬拜詩歌</h2>
 <label class="f">歌名<input id="ws_t"></label><label class="f">YouTube 網址（單首或播放清單都可以）<input id="ws_u"></label>
 <label class="f"><input type="checkbox" id="ws_theme"> ⭐ 設為本季主題詩歌（每堂課都會出現）</label>
 <div class="actions"><button class="blue" onclick="quickSong()">加入</button></div>`)}
function quickSong(){const u=document.getElementById('ws_u').value.trim();if(!ytId(u)){toast('請貼上 YouTube 網址');return}
 const l=cur();const t=document.getElementById('ws_t').value.trim()||('敬拜詩歌 '+(worshipList(l).length+1));const th=document.getElementById('ws_theme').checked;
 const sg={id:uid(),title:t,season:l.season||'',theme:th,video:u,lyrics:'',notes:''};D.songs.push(sg);
 if(!th&&l.id){l.songIds=l.songIds||[];l.songIds.push(sg.id)}
 curSong=sg.id;save('新增敬拜詩歌 '+t);closeModal();render();toast('已加入 '+t)}
function tIce(){const l=cur();const st=l.expSteps||[];
 return stepPage(`${l.iceName?`<div class="tbar" style="font-size:24px;font-weight:700">🎲 ${h(l.iceName)}</div>`:''}
  ${st.length?`<div class="bigcard fit" data-max="34"><ol>${st.map(x=>`<li>${h(x)}</li>`).join('')}</ol>
   ${l.props&&l.props.length?`<div style="color:#f2c46b;margin-top:.4em;font-size:.75em">🧰 道具：${l.props.map(h).join('、')}</div>`:''}
   ${l.safety?`<div style="color:#ffcf9e;font-size:.75em">⚠️ ${h(l.safety)}</div>`:''}</div>`:'<div class="empty">這一課還沒有寫破冰遊戲</div>'}`)}
function tIntro(){const l=cur();const t=l.intro||l.story;
 return stepPage(`<div class="bigcard fit" data-max="40"><div style="font-size:1.25em;font-weight:700">${h(l.title)}</div><div style="color:#f2c46b;font-size:.7em;margin-bottom:.4em">📜 ${h(l.scripture)}</div>
  <div class="pre">${h(t)||'（這一課還沒有寫前言）'}</div></div>`)}
function tVideo(){const l=cur();const yt=ytId(l.video);
 return stepPage(yt?`<div class="tbar"><button class="pri" style="flex:1;font-size:22px;padding:12px" onclick="playFull('${yt}')">▶ 全螢幕播放〈${h(l.title)}〉</button></div><div class="vwrap">${ytBox(yt)}</div>`
  :l.video?`<div class="empty"><a class="pri" style="display:inline-block;padding:16px 30px;border-radius:10px;background:#e2572a;color:#fff;font-size:22px;text-decoration:none" href="${h(l.video)}" target="_blank" rel="noopener">▶ 開啟影片〈${h(l.title)}〉</a></div>`
  :'<div class="empty">這一課還沒有影片網址</div>')}
function tQA(){const l=cur();const q=l.questions||[];
 if(!q.length)return stepPage('<div class="empty">這一課還沒有問答題目</div>');
 if(qIdx>=q.length)qIdx=q.length-1;
 if(qAll)return stepPage(`<div class="tbar"><span class="sp"></span><button class="ghost" onclick="qAll=false;render()">一題一題看</button></div><div class="bigcard fit" data-max="36"><ol>${q.map(x=>`<li>${h(x)}</li>`).join('')}</ol></div>`);
 return stepPage(`<div class="tbar"><b style="font-size:18px">第 ${qIdx+1} 題 / 共 ${q.length} 題</b><span class="sp"></span><button class="ghost" ${qIdx?'':'disabled'} onclick="qIdx--;render()">← 上一題</button><button class="blue" ${qIdx<q.length-1?'':'disabled'} onclick="qIdx++;render()">下一題 →</button><button class="ghost" onclick="qAll=true;render()">全部列出</button></div>
  <div class="qcard fit" data-max="56">${h(q[qIdx])}</div>`)}
function tPray(){const l=cur();
 return stepPage(`<div class="bigcard fit" data-max="36"><div style="text-align:center;font-size:1.4em">🙏</div><div class="pre">${h(l.prayer||D.settings.prayer)}</div>
  <div style="text-align:center;margin-top:.6em;color:#f2c46b">🐑 下課囉！我們下週見 👋</div></div>`)}
function fsEl(sel){const e=document.querySelector(sel);if(!e)return;const f=e.requestFullscreen||e.webkitRequestFullscreen;if(f)f.call(e)}
function tLesson(){const p=lessonPicker('');return `${p}<div class="card">${lessonBody(lessonById(curLesson))}</div>`}

function tokens(s,lang){return lang==='zh'?[...s]:s.split(/(\s+)/)}
function isWord(t){return /[\p{L}\p{N}]/u.test(t)}
function verseHtml(s,lang){return tokens(s,lang).map((t,i)=>isWord(t)?`<span class="tok ${hidTok.has(lang+i)?'hid':''}" onclick="hidTok.delete('${lang}${i}');render()">${h(t)}</span>`:h(t)).join('')}
function tVerse(){
 const l=cur();if(!l.id)return stepPage('');
 return stepPage(`<div class="tbar">${[['both','中英'],['zh','中文'],['en','English']].map(([k,n])=>`<button class="${verseLang===k?'pri':'ghost'}" onclick="verseLang='${k}';hidTok.clear();render()">${n}</button>`).join('')}
  <span class="sp"></span><button class="ghost" onclick="hideMore()">🙈 遮一些</button><button class="ghost" onclick="hidTok.clear();render()">全部顯示</button><button class="ghost" onclick="fsEl('#proj')">⛶ 全螢幕</button></div>
  <div class="proj fit" data-max="64" id="proj">
   ${verseLang!=='en'&&l.verseZh?`<div class="zh">${verseHtml(l.verseZh,'zh')}</div>`:''}
   ${verseLang!=='zh'&&l.verseEn?`<div class="en">${verseHtml(l.verseEn,'en')}</div>`:''}
   <div class="ref">${h(l.verseRef)}</div></div>`)}
function hideMore(){const l=cur();const all=[];
 if(verseLang!=='en'&&l.verseZh)tokens(l.verseZh,'zh').forEach((t,i)=>isWord(t)&&!hidTok.has('zh'+i)&&all.push('zh'+i));
 if(verseLang!=='zh'&&l.verseEn)tokens(l.verseEn,'en').forEach((t,i)=>isWord(t)&&!hidTok.has('en'+i)&&all.push('en'+i));
 const n=Math.max(1,Math.ceil(all.length*.3));for(let i=0;i<n&&all.length;i++)hidTok.add(all.splice(Math.floor(Math.random()*all.length),1)[0]);render()}
function tSong(){
 if(!D.songs.length)return '<div class="empty">還沒有詩歌</div>';
 const s=D.songs.find(x=>x.id===curSong)||D.songs[0];curSong=s.id;const yt=ytId(s.video);
 return `<div class="row" style="margin-bottom:10px"><select class="sp" onchange="curSong=this.value;render()">${D.songs.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${h(x.season?x.season+'｜':'')}${h(x.title)}</option>`).join('')}</select>
  <button class="ghost" onclick="fontSize=Math.max(16,fontSize-4);render()">A−</button><button class="ghost" onclick="fontSize+=4;render()">A＋</button>
  <button class="ghost" onclick="document.getElementById('lyr').requestFullscreen&&document.getElementById('lyr').requestFullscreen()">⛶</button></div>
  ${yt?`<button class="pri" style="width:100%;margin-bottom:8px" onclick="playFull('${yt}')">▶ 全螢幕播放</button><div style="margin-bottom:10px">${ytBox(yt)}</div>`:s.video?`<p><a href="${h(s.video)}" target="_blank" rel="noopener">▶ 開啟詩歌影片</a></p>`:''}
  <div class="lyrics" id="lyr" style="font-size:${fontSize}px"><b>${h(s.title)}</b>\n\n${h(s.lyrics)}</div>`;
}

function canPoint(){return !(authOn()&&D.settings.requireLogin&&!user)}
function nowHM(){const t=new Date();return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')}
function ciLabel(on){return D.settings.cutoff+(on?'前報到':'後報到')}
function todayOf(id){const d=today();return D.ledger.filter(x=>x.kidId===id&&x.date===d)}
function tPoints(){
 if(!canPoint())return `<div class="card empty">目前設定為「加點需要老師登入」<br><br><button class="blue" onclick="loginDlg()">老師登入</button></div>`;
 const S=D.settings,d=today();const at=D.attend[d]||{};const kids=D.kids.filter(k=>k.active).sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
 const auto=nowHM()<S.cutoff;
 const hint=manageKids?'管理名單中：點孩子的名字可以隱藏、改名或刪除'+(D.kids.some(k=>!k.active)?`　<a href="#" onclick="hiddenKidsDlg();return false">查看已隱藏的孩子（${D.kids.filter(k=>!k.active).length}）</a>`:''):pickItem===null?`點名字＝報到（現在 ${nowHM()}，${auto?'準時 +'+S.onPts:'晚到 +'+S.latePts}）`:pickItem==='on'?'點名字＝準時報到 +'+S.onPts:pickItem==='late'?'點名字＝晚到報到 +'+S.latePts:'點名字＝「'+h(S.items[pickItem].name)+'」，再點一次取消';
 return `<div class="stage"><div class="stephead"><h2>⭐ ${d} 點名加點</h2><span class="sp"></span><span class="muted" style="margin-right:10px">報到 ${Object.keys(at).length} 人</span><button class="${manageKids?'blue':'ghost'}" onclick="manageKids=!manageKids;render()">${manageKids?'✓ 完成管理':'👥 管理名單'}</button></div>
  <div class="fill"><div class="tbar items">
   <button class="${pickItem===null?'on':''}" onclick="pickItem=null;render()">✅ 報到（自動判斷）</button><button class="${pickItem==='on'?'on':''}" onclick="pickItem='on';render()">準時 +${S.onPts}</button><button class="${pickItem==='late'?'on':''}" onclick="pickItem='late';render()">晚到 +${S.latePts}</button>
   <span style="width:12px"></span>
   ${S.items.map((it,i)=>`<button class="${pickItem===i?'on':''}" onclick="pickItem=${i};render()">${h(it.name)} +${it.pts}</button>`).join('')}</div>
  <div class="muted" style="flex-shrink:0;margin-bottom:6px">${hint}</div>
  <div class="fit kidsfit" data-max="28"><div class="kids">${kids.map(k=>{const t=todayOf(k.id);const tp=t.reduce((a,x)=>a+x.pts,0);const ci=t.find(x=>x.id===at[k.id]);
   const done=pickItem!==null&&typeof pickItem==='number'&&t.some(x=>x.reason===S.items[pickItem].name);
   return `<div class="kid ${ci?(ci.reason===ciLabel(true)?'here':'here late'):''} ${done?'got':''}" id="k_${k.id}" onclick="${manageKids?'kidManage':'tapKid'}('${k.id}')"><div class="n">${manageKids?'✏️ ':''}${h(k.name)}</div><div class="p">今日 +${tp}</div><div class="p">⭐ ${bal(k.id)}</div></div>`}).join('')}</div></div></div>
  <div class="row" style="margin-top:8px;flex-shrink:0"><input id="newKid" class="sp" style="font-size:16px" placeholder="新朋友的名字" onkeydown="if(event.key==='Enter')quickKid()"><button class="pri" onclick="quickKid()">＋加入並報到</button>
   <button class="ghost" onclick="undo()" ${undoStack.length?'':'disabled'}>↶ 復原</button></div></div>`;
}
let manageKids=false;
function kidManage(id){const k=kid(id);
 openModal(`<h2>${h(k.name)}</h2><div class="muted">累計 ⭐ ${bal(id)}</div>
 <label class="f">改名<input id="km_n" value="${h(k.name)}"></label>
 <div class="actions"><button class="blue" onclick="renameKid('${id}')">儲存名字</button></div>
 <div class="card" style="margin-top:12px"><b>🙈 隱藏</b><p class="muted">不再出現在點名畫面，點數和紀錄都保留，之後可以恢復。適合暫時不來的孩子。</p><button onclick="hideKid('${id}')">隱藏這位孩子</button></div>
 <div class="card" style="border-color:#f0c4c4"><b style="color:#c33">🗑 刪除</b><p class="muted">連同所有點數和紀錄一起永久刪除，無法復原。適合輸入錯誤的名字。</p><button class="danger" onclick="deleteKid('${id}')">永久刪除</button></div>`)}
function renameKid(id){const n=document.getElementById('km_n').value.trim();if(!n)return;const k=kid(id);const o=k.name;k.name=n;save('孩子改名 '+o+' → '+n);closeModal();render();toast('已改名為 '+n)}
function hideKid(id){const k=kid(id);k.active=false;save('隱藏孩子 '+k.name);closeModal();render();toast('已隱藏 '+k.name)}
function deleteKid(id){const k=kid(id);if(!confirm(`確定要永久刪除「${k.name}」和他所有的點數紀錄嗎？`))return;
 D.kids=D.kids.filter(x=>x.id!==id);D.ledger=D.ledger.filter(x=>x.kidId!==id);
 for(const d in D.attend)delete D.attend[d][id];D.sessions.forEach(s=>{s.kidNotes=(s.kidNotes||[]).filter(n=>n.kidId!==id)});
 undoStack=[];save('刪除孩子 '+k.name);closeModal();render();toast('已刪除 '+k.name)}
function hiddenKidsDlg(){const ks=D.kids.filter(k=>!k.active);
 openModal(`<h2>已隱藏的孩子</h2>${ks.map(k=>`<div class="row card" style="margin:6px 0"><b class="sp">${h(k.name)}</b><span class="muted">⭐ ${bal(k.id)}</span><button class="blue sm" onclick="kid('${k.id}').active=true;save('恢復孩子 '+kid('${k.id}').name);hiddenKidsDlg();render()">恢復</button><button class="danger sm" onclick="deleteKid('${k.id}')">刪除</button></div>`).join('')||'<p class="muted">沒有隱藏的孩子</p>'}`)}
function addPts(kidId,pts,reason){const e={id:uid(),kidId,pts,reason,date:today(),by:who(),ts:Date.now()};D.ledger.push(e);return e}
function delLedger(lid){D.ledger=D.ledger.filter(x=>x.id!==lid);undoStack=undoStack.filter(u=>u.lid!==lid)}
function tapKid(id){
 const S=D.settings,d=today();D.attend[d]=D.attend[d]||{};const k=kid(id);
 if(pickItem===null||pickItem==='on'||pickItem==='late'){
  const on=pickItem===null?nowHM()<S.cutoff:pickItem==='on';const old=D.ledger.find(x=>x.id===D.attend[d][id]);
  if(old&&(pickItem===null||old.reason===ciLabel(on))){delLedger(old.id);delete D.attend[d][id];save();toast('取消 '+k.name+' 的報到')}
  else{if(old)delLedger(old.id);const e=addPts(id,on?S.onPts:S.latePts,ciLabel(on));D.attend[d][id]=e.id;undoStack.push({lid:e.id,att:true,d});save();toast(k.name+' '+e.reason+' +'+e.pts)}
 }else{const it=S.items[pickItem];const old=todayOf(id).find(x=>x.reason===it.name);
  if(old){delLedger(old.id);save();toast('取消 '+k.name+' 的「'+it.name+'」')}

const IMP_MAP={'前言':'intro','妙妙書前言':'intro','破冰':'expSteps','破冰遊戲':'iceName','問答':'questions','禱告':'prayer','日期':'date','經文':'scripture','影片':'video','故事':'story','重點':'story','故事重點':'story','體驗':'expSteps','體驗活動':'expSteps','道具':'props','安全':'safety','安全提醒':'safety','討論':'questions','討論問題':'questions','金句出處':'verseRef','中文金句':'verseZh','金句':'verseZh','英文金句':'verseEn','備註':'notes'};
const IMP_LISTS=['expSteps','props','questions'];
function parseLessons(txt){
 const out=[];let season='第一季',L=null,sec=null;
 for(const raw of txt.split(/\r?\n/)){const line=raw.trim();if(!line)continue;
  if(/^#(?!#)/.test(line)){season=line.replace(/^#\s*/,'');L=null;continue}
  if(/^##/.test(line)){const t=line.replace(/^#+\s*/,'');const m=t.match(/^第\s*(\d+)\s*課\s*(.*)$/);
   L={id:uid(),season,no:m?Number(m[1]):out.filter(x=>x.season===season).length+1,title:m?(m[2]||t):t,date:'',scripture:'',video:'',story:'',expSteps:[],props:[],safety:'',questions:[],verseRef:'',verseZh:'',verseEn:'',songIds:[],notes:'',intro:'',iceName:'',prayer:''};out.push(L);sec=null;continue}
  if(!L)continue;
  const m=line.match(/^([^:：]{1,6})[:：]\s*(.*)$/);
  if(m&&IMP_MAP[m[1].trim()]){sec=IMP_MAP[m[1].trim()];if(m[2])put(L,sec,m[2]);continue}
  const it=line.match(/^(?:[-•*．]|\d+[.、)）])\s*(.*)$/);
  put(L,sec||'story',it&&IMP_LISTS.includes(sec)?it[1]:line);
 }
 return out;
 function put(L,k,v){if(IMP_LISTS.includes(k))L[k].push(v);else if(['date','video','verseRef','iceName'].includes(k))L[k]=v;else L[k]=L[k]?L[k]+'\n'+v:v}
}

 <label class="f">這堂課<select id="s_lesson"><option value="">（未指定）</option>${lessonOpts(s.lessonId)}</select></label>
 <label class="f">上課老師<div class="checks" id="s_t">${teacherNames().map(n=>`<label><input type="checkbox" value="${h(n)}" ${(s.teachers||[]).includes(n)?'checked':''}> ${h(n)}</label>`).join('')}</div></label>
 <div class="muted" style="margin-top:8px">當天點名出席：${present.length} 人（從「點名加點」自動帶入）</div>
 <label class="f">整體狀況（秩序、參與度、活動進行得如何）<textarea id="s_o">${h(s.overall)}</textarea></label>
 <label class="f">交接給下一位老師<textarea id="s_h">${h(s.handover)}</textarea></label>
 <div class="sec"><h4>個別孩子備註</h4><label class="muted"><input type="checkbox" ${sessAll?'checked':''} onchange="sessAll=this.checked;keepSess()"> 顯示所有孩子（預設只顯示當天出席）</label>
 ${ks.map(k=>`<div class="row" style="margin-top:6px"><b style="width:70px">${h(k.name)}</b><input class="sp kn" data-k="${k.id}" value="${h(note(k).note)}" placeholder="狀況備註（可空白）"><label class="muted"><input type="checkbox" class="kf" data-k="${k.id}" ${note(k).flag?'checked':''}> 需留意</label></div>`).join('')||'<div class="muted">當天還沒有人簽到</div>'}</div>
 <div class="actions"><button class="blue" onclick="saveSession()">儲存</button>${id?`<button class="danger" onclick="if(confirm('刪除這筆紀錄？')){D.sessions=D.sessions.filter(x=>x.id!=='${id}');save('刪除上課紀錄');closeModal();render()}">刪除</button>`:''}</div>`);
}
function readSess(){const s=window._sess.s;
 const v={date:document.getElementById('s_date').value||today(),lessonId:document.getElementById('s_lesson').value,
  teachers:[...document.querySelectorAll('#s_t input:checked')].map(x=>x.value),overall:document.getElementById('s_o').value.trim(),handover:document.getElementById('s_h').value.trim()};
 const flags={};document.querySelectorAll('.kf').forEach(e=>flags[e.dataset.k]=e.checked);
 v.kidNotes=[...document.querySelectorAll('.kn')].map(e=>({kidId:e.dataset.k,note:e.value.trim(),flag:flags[e.dataset.k]})).filter(n=>n.note||n.flag);
 return v}
function keepSess(){const v=readSess();sessionDlg(window._sess.id,{...window._sess.s,...v})}
function saveSession(){const v=readSess();const {id}=window._sess;
 v.attendance=Object.keys(D.attend[v.date]||{});v.by=who();
 if(id)Object.assign(D.sessions.find(x=>x.id===id),v);else D.sessions.push({id:uid(),...v});
 v.kidNotes.forEach(n=>{const k=kid(n.kidId);if(k&&n.flag){k.flag=true;k.flagNote=n.note||k.flagNote}});
 save((id?'修改':'新增')+'上課紀錄 '+v.date);closeModal();render();toast('已儲存')}

/* ============ 會議 ============ */
function pMeetings(){
 return `<div class="row" style="margin-bottom:10px"><h2 class="sp">會議</h2><button class="blue" onclick="newMeeting()">＋新會議</button></div>
 <p class="muted">開會時每位老師在自己手機登入、進入同一個會議，各自在議程下輸入意見、決議、待辦，系統會整合成一份會議記錄。（初版資料存在本機，要接上雲端後才能多支手機同步。）</p>
 ${[...D.meetings].sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<div class="card row"><div class="sp"><b>${h(m.title)}</b><div class="muted">${h(m.date)} · ${m.agenda.length} 項議程 · ${m.entries.length} 則紀錄</div></div><button class="sm blue" onclick="curMeeting='${m.id}';go('meeting')">進入</button></div>`).join('')||'<div class="empty">還沒有會議</div>'}`;
}
function newMeeting(){form('新會議',[['title','會議名稱'],['date','日期','date'],['agenda','議程（一行一項）','lines']],{date:today(),title:'主日學同工會'},v=>{
 if(!v.title)return false;const m={id:uid(),title:v.title,date:v.date,agenda:v.agenda.map(t=>({id:uid(),title:t})),entries:[]};if(!m.agenda.length)m.agenda.push({id:uid(),title:'一般討論'});
 D.meetings.push(m);curMeeting=m.id;tab='meeting';save('新增會議 '+v.title)})}
function pMeeting(){
 const m=D.meetings.find(x=>x.id===curMeeting);if(!m)return pMeetings();
 return `<div class="row" style="margin-bottom:6px"><button class="sm ghost" onclick="go('meetings')">← 會議列表</button><span class="sp"></span><button class="sm ghost" onclick="render()">↻ 重新整理</button><button class="blue" onclick="compileDlg()">📋 整合會議記錄</button></div>
 <h2>${h(m.title)}</h2>${authOn()?'':`<div class="row" style="margin:6px 0"><span class="muted">我是：</span><select onchange="myName=this.value;try{sessionStorage.setItem('ss_name',myName)}catch(e){};render()"><option value="">請選擇</option>${teacherNames().map(n=>`<option ${n===myName?'selected':''}>${h(n)}</option>`).join('')}</select></div>`}<div class="muted" style="margin-bottom:10px">${h(m.date)} · 參與輸入：${[...new Set(m.entries.map(e=>e.by))].map(h).join('、')||'尚無'}</div>
 ${m.agenda.map((a,ai)=>{const es=m.entries.filter(e=>e.aid===a.id);return `<div class="card"><h3>${ai+1}. ${h(a.title)}</h3>
  ${es.map(e=>`<div class="entry ${e.type}"><span class="tag ${{決議:'d',待辦:'t',意見:'o'}[e.type]}">${e.type}</span> ${h(e.text)}${e.type==='待辦'?` <span class="muted">→ ${h(e.owner||'未指定')}${e.due?'，'+h(e.due)+'前':''}</span>`:''} <span class="muted">— ${h(e.by)}</span>${e.by===who()?` <button class="sm ghost" onclick="delEntry('${e.id}')">✕</button>`:''}</div>`).join('')}
  <div class="row" style="margin-top:8px"><select id="ty_${a.id}" onchange="document.getElementById('td_${a.id}').style.display=this.value==='待辦'?'flex':'none'"><option>意見</option><option>決議</option><option>待辦</option></select>
   <input class="sp" id="tx_${a.id}" placeholder="輸入內容" onkeydown="if(event.key==='Enter')addEntry('${a.id}')"><button class="blue" onclick="addEntry('${a.id}')">送出</button></div>
  <div class="row" id="td_${a.id}" style="display:none;margin-top:6px"><input id="ow_${a.id}" placeholder="負責人" style="width:110px"><input id="du_${a.id}" type="date"></div></div>`}).join('')}
 <div class="row"><input id="newAg" class="sp" placeholder="臨時動議／新增議程"><button class="ghost" onclick="const v=document.getElementById('newAg').value.trim();if(v){D.meetings.find(x=>x.id==='${m.id}').agenda.push({id:uid(),title:v});save();render()}">＋議程</button></div>`;
}
function addEntry(aid){if(!authOn()&&!myName){toast('請先在上方選擇「我是」哪位老師');return}const m=D.meetings.find(x=>x.id===curMeeting);const g=k=>document.getElementById(k+'_'+aid).value.trim();
 const text=g('tx');if(!text)return;const type=document.getElementById('ty_'+aid).value;
 m.entries.push({id:uid(),aid,type,text,owner:type==='待辦'?g('ow'):'',due:type==='待辦'?g('du'):'',by:who(),ts:Date.now()});save();render();
 const n=document.getElementById('tx_'+aid);n&&n.focus()}
function delEntry(id){const m=D.meetings.find(x=>x.id===curMeeting);m.entries=m.entries.filter(e=>e.id!==id);save();render()}
function compileMeeting(m){
 const ppl=[...new Set(m.entries.map(e=>e.by))];const E=t=>m.entries.filter(e=>e.type===t);
 let s=`【${m.title}】會議記錄\n日期：${m.date}\n參與：${ppl.join('、')}\n\n`;
 m.agenda.forEach((a,i)=>{const es=m.entries.filter(e=>e.aid===a.id).sort((x,y)=>x.ts-y.ts);s+=`${i+1}. ${a.title}\n`;
  const op=es.filter(e=>e.type==='意見'),dc=es.filter(e=>e.type==='決議'),td=es.filter(e=>e.type==='待辦');
  if(op.length)s+='  討論：\n'+op.map(e=>`   • ${e.text}（${e.by}）`).join('\n')+'\n';
  if(dc.length)s+='  決議：\n'+dc.map(e=>`   ✔ ${e.text}`).join('\n')+'\n';
  if(td.length)s+='  待辦：\n'+td.map(e=>`   □ ${e.text} → ${e.owner||'未指定'}${e.due?'（'+e.due+'前）':''}`).join('\n')+'\n';
  if(!es.length)s+='  （無紀錄）\n';s+='\n'});
 if(E('決議').length)s+='━━ 決議總表 ━━\n'+E('決議').map((e,i)=>`${i+1}. ${e.text}`).join('\n')+'\n\n';
 if(E('待辦').length)s+='━━ 待辦事項 ━━\n'+E('待辦').sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).map((e,i)=>`${i+1}. ${e.text}｜${e.owner||'未指定'}｜${e.due||'無期限'}`).join('\n')+'\n';
 return s}
function compileDlg(){const m=D.meetings.find(x=>x.id===curMeeting);const t=compileMeeting(m);window._mt=t;
 openModal(`<h2>整合會議記錄</h2><div class="pre card" style="font-size:14px">${h(t)}</div>
 <div class="actions"><button class="blue" onclick="copy(window._mt)">複製</button><button onclick="window.print()">🖨 列印</button>
 <button class="ghost" onclick="copy('請把以下教會兒童主日學同工會的會議紀錄整理成通順、條理清楚的正式會議記錄，保留所有決議與待辦（負責人與期限），不要增加原文沒有的內容：\\n\\n'+window._mt)">複製給 Claude 整理</button></div>`)}

/* ============ 設定 ============ */
function myAccount(){return `<div class="card"><h3>我的帳號：${h(user)}</h3>
 <label class="f">目前密碼<input id="mp_o" type="password"></label><label class="f">新密碼（至少 6 碼）<input id="mp_n" type="password"></label><label class="f">再輸入一次<input id="mp_n2" type="password"></label>
 <div class="actions"><button class="blue" onclick="changeMyPw()">修改密碼</button></div></div>`}
async function changeMyPw(){const t=me();if(t.pwHash!==await hashPw(document.getElementById('mp_o').value)){toast('目前密碼不正確');return}
 const p=document.getElementById('mp_n').value;if(!pwOk(p,document.getElementById('mp_n2').value))return;t.pwHash=await hashPw(p);save('修改自己的密碼');render();toast('密碼已更新')}
function pSettings(){const S=D.settings;
 if(authOn()&&!isAdmin())return `<h2>設定</h2>${myAccount()}<div class="card"><h3>資料備份</h3><button onclick="exportAll()">⬇ 匯出備份</button></div><p class="muted">系統設定與老師帳號由主控管理。</p>`;
 const now=Date.now();const open=D.invites.filter(i=>!i.usedBy&&!i.revoked&&i.expires>now);const used=D.invites.filter(i=>i.usedBy).slice(-5).reverse();
 const admins=D.teachers.filter(t=>t.role==='admin'&&t.active!==false).length;
 const authCard=authOn()?`<div class="card"><div class="row"><h3 class="sp">🔐 老師帳號登入：已啟用</h3><button class="sm danger" onclick="if(confirm('關閉帳號登入？帳號資料會保留')){D.settings.auth=false;setUser(null);save('關閉老師帳號登入');render()}">關閉</button></div></div>`
  :`<div class="card"><h3>🔐 老師帳號（規劃中，目前未啟用）</h3><p class="muted">啟用後，老師要用自己的帳號登入才能進老師區；新老師需要主控發的驗證碼才能註冊。目前未啟用，任何人都能進老師區。</p>
   <button class="ghost" onclick="enableAuth()">試用帳號功能</button></div>`;
 return `<h2>設定${authOn()?'（主控）':''}</h2>${authCard}${authOn()?`
 <div class="card"><h3>🔑 發驗證碼給新老師</h3><p class="muted">每組驗證碼限用一次、7 天內有效。用 LINE 傳給老師，老師在登入畫面點「用驗證碼註冊」。</p>
 <div class="row"><input id="iv_note" class="sp" placeholder="給誰（例如：陳姊妹）"><button class="blue" onclick="genInvite()">產生驗證碼</button></div>
 ${open.map(i=>`<div class="row card" style="margin:8px 0"><b style="font-size:22px;letter-spacing:3px;font-family:monospace">${i.code}</b><span class="sp muted">${h(i.note)} · ${new Date(i.expires).toLocaleDateString('zh-TW')} 前有效</span><button class="sm ghost" onclick="copyInvite('${i.code}')">複製訊息</button><button class="sm danger" onclick="revokeInvite('${i.code}')">作廢</button></div>`).join('')}
 ${used.length?`<div class="muted" style="margin-top:6px">最近使用：${used.map(i=>`${i.code} → ${h(i.usedBy)}（${h(i.usedAt)}）`).join('、')}</div>`:''}</div>
 <div class="card"><h3>👥 老師帳號</h3><table>${D.teachers.map(t=>`<tr style="${t.active===false?'opacity:.5':''}"><td><b>${h(t.name)}</b> ${t.role==='admin'?'<span class="tag t">主控</span>':'<span class="tag o">老師</span>'}${t.active===false?' <span class="tag">已停用</span>':''}<div class="muted">${h(t.created||'')} 加入</div></td>
 <td style="text-align:right">${t.name===user?'<span class="muted">（你）</span>':`<button class="sm ghost" onclick="resetPw('${t.id}')">重設密碼</button> <button class="sm ghost" onclick="toggleRole('${t.id}')">${t.role==='admin'?'改為老師':'設為主控'}</button> <button class="sm ${t.active===false?'ghost':'danger'}" onclick="toggleT('${t.id}')">${t.active===false?'啟用':'停用'}</button>`}</td></tr>`).join('')}</table>
 <p class="muted">停用的老師不能再登入，但過去寫的紀錄都會保留。目前主控 ${admins} 位，建議至少兩位，避免主控忘記密碼時沒人能管理。</p></div>
`:''}
 <div class="card"><h3>⭐ 點數與教學設定</h3><label class="f">名稱<input id="st_c" value="${h(S.church)}"></label>
 <label class="f">① 主日學規則（一行一條，上課時大家一起念）<textarea id="st_rules">${h((S.rules||[]).join('\n'))}</textarea></label>
 <label class="f">⑧ 預設結束禱告<textarea id="st_pray">${h(S.prayer||'')}</textarea></label>
 ${authOn()?'':`<label class="f">老師名單（一行一位，用於上課紀錄與會議）<textarea id="st_tn">${h((S.teacherNames||[]).join('\n'))}</textarea></label>`}
 ${authOn()?`<label class="f"><input type="checkbox" id="st_r" ${S.requireLogin?'checked':''}> 教學模式點名加點需要老師登入</label>`:''}
 <div class="row"><label class="f">報到截止時間<input id="st_cut" type="time" value="${h(S.cutoff)}"></label><label class="f">準時報到點數<input id="st_on" type="number" value="${S.onPts}"></label><label class="f">晚到報到點數<input id="st_late" type="number" value="${S.latePts}"></label></div><p class="muted">準時與晚到不重複計算；其他項目每人每天各算一次。</p>
 <label class="f">其他加分項目（一行一個：名稱 | 點數）<textarea id="st_i">${h(S.items.map(i=>i.name+' | '+i.pts).join('\n'))}</textarea></label>
 <label class="f">獎勵（一行一個：名稱 | 所需點數）<textarea id="st_w">${h(S.rewards.map(i=>i.name+' | '+i.cost).join('\n'))}</textarea></label>
 <div class="actions"><button class="blue" onclick="saveSettings()">儲存設定</button></div></div>
 ${authOn()?myAccount():''}
 <div class="card"><h3>資料備份</h3><p class="muted">${Cloud.pw?'資料存在教會的 Google 試算表「小羊樂園資料庫」，所有老師共用。也可以另外匯出一份備份。':'資料目前只存在這台裝置的瀏覽器裡，請定期匯出備份。'}</p>
 <div class="row"><button onclick="exportAll()">⬇ 匯出備份</button><label style="border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer">⬆ 匯入備份<input type="file" accept=".json" style="display:none" onchange="importAll(this.files[0])"></label>
 ${Cloud.pw?'':`<button class="danger" onclick="if(confirm('清除所有資料（含老師帳號）並恢復範例？此動作無法復原')){D=demo();setUser(null);save();setMode('teach')}">重置</button>`}</div></div>
 <div class="card"><h3>最近異動</h3><table>${D.log.slice(0,30).map(l=>`<tr><td class="muted" style="white-space:nowrap">${h(l.ts)}</td><td>${h(l.by)}</td><td>${h(l.act)}</td></tr>`).join('')||'<tr><td class="muted">無</td></tr>'}</table></div>`}
function enableAuth(){if(!confirm('啟用老師帳號登入？之後進老師區需要登入。（可以隨時關閉）'))return;D.settings.auth=true;save('啟用老師帳號登入');if(!D.teachers.some(t=>t.role==='admin'))setupDlg();else{setMode('teach');loginDlg()}}
function genInvite(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c;do{c=[...Array(6)].map(()=>A[Math.floor(Math.random()*A.length)]).join('')}while(D.invites.some(i=>i.code===c));
 D.invites.push({code:c,note:val('iv_note'),by:user,created:today(),expires:Date.now()+7*864e5});save('產生驗證碼 '+c);render();copyInvite(c)}
function copyInvite(c){const i=D.invites.find(x=>x.code===c);copy(`🐑 小羊樂園 老師註冊驗證碼：${c}\n打開小羊樂園 app → 老師登入 → 用驗證碼註冊。\n驗證碼限用一次，${new Date(i.expires).toLocaleDateString('zh-TW')} 前有效。`)}
function revokeInvite(c){if(!confirm('作廢驗證碼 '+c+'？'))return;D.invites.find(x=>x.code===c).revoked=true;save('作廢驗證碼 '+c);render()}
function toggleT(id){const t=D.teachers.find(x=>x.id===id);t.active=t.active===false;save((t.active?'啟用':'停用')+'老師 '+t.name);render()}
function toggleRole(id){const t=D.teachers.find(x=>x.id===id);t.role=t.role==='admin'?'teacher':'admin';save(t.name+' 改為'+(t.role==='admin'?'主控':'老師'));render()}
async function resetPw(id){const t=D.teachers.find(x=>x.id===id);const p=prompt(`替「${t.name}」設定臨時密碼（至少 6 碼），請對方登入後自己修改`);if(p===null)return;
 if(p.length<6){toast('密碼至少 6 碼');return}t.pwHash=await hashPw(p);save('重設 '+t.name+' 的密碼');toast('已重設')}
function saveSettings(){const v=k=>document.getElementById(k).value;const S=D.settings;
 S.church=v('st_c').trim()||'小羊樂園';S.rules=v('st_rules').split('\n').map(x=>x.trim()).filter(Boolean);S.prayer=v('st_pray').trim()||DEFAULT_PRAYER;const r=document.getElementById('st_r');if(r)S.requireLogin=r.checked;const tn=document.getElementById('st_tn');if(tn)S.teacherNames=tn.value.split('\n').map(x=>x.trim()).filter(Boolean);S.cutoff=v('st_cut')||'10:30';S.onPts=Number(v('st_on'))||2;S.latePts=Number(v('st_late'))||1;
 S.items=pairs(v('st_i').split('\n')).map(p=>({name:p[0],pts:Number(p[1])||1}));
 S.rewards=pairs(v('st_w').split('\n')).map(p=>({name:p[0],cost:Number(p[1])||1}));
 save('修改設定');render();toast('設定已儲存')}
function exportAll(){const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='little-lambs-meadow-backup_'+today()+'.json';a.click()}
async function importAll(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!d.settings)throw Error('格式不符');if(!confirm('用備份檔取代目前所有資料？'))return;D=d;save('匯入備份');render();toast('已匯入')}catch(e){toast('匯入失敗：'+e.message)}}

document.addEventListener('keydown',e=>{
 if(mode!=='teach'||document.getElementById('modal').classList.contains('on'))return;
 const t=document.activeElement&&document.activeElement.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
 if(e.key==='ArrowRight'||e.key==='PageDown'){stepGo(1);e.preventDefault()}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){stepGo(-1);e.preventDefault()}
 else if(/^[1-8]$/.test(e.key)){go(STEPS[Number(e.key)-1][0])}
});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
render();
cloudStart();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
