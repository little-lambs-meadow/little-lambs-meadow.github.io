<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e2572a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小羊樂園">
<title>小羊樂園 Little Lambs Meadow</title>
<style>
:root{--bg:#f7f3ec;--card:#fff;--ink:#2b2622;--muted:#7a7068;--pri:#e2572a;--soft:#fde8df;--blue:#2a6fd6;--bsoft:#e3eefc;--ok:#2e9b5a;--warn:#c9711c;--wsoft:#fff1df;--line:#e6ddd0}
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f7f3ec;color:#2b2622;line-height:1.6;-webkit-tap-highlight-color:transparent}
header{color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,0.13)}
header.teach{background:linear-gradient(135deg,#e2572a,#f2a128)}
header.staff{background:linear-gradient(135deg,#2a5bd6,#3f8fe0)}
.hrow{display:flex;gap:8px;align-items:center;justify-content:space-between;max-width:1400px;margin:auto;padding:10px 16px 4px}
header h1{margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.who button{white-space:nowrap}
@media(max-width:480px){.uname{display:none}}
.who{font-size:13px;display:flex;gap:6px;align-items:center;flex-shrink:0;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;max-width:1400px;margin:auto;padding:4px 12px 8px}
nav button{background:rgba(255,255,255,0.15);color:#fff;white-space:nowrap}
nav button.on{background:#fff;color:#2b2622;font-weight:700}
button{font:inherit;font-size:14px;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;background:#fff;color:#2b2622}
button.pri{background:#e2572a;color:#fff}
button.blue{background:#2a6fd6;color:#fff}
button.ghost{background:transparent;border:1px solid #e6ddd0}
button.danger{color:#c33;border:1px solid #f0c4c4;background:#fff}
button.sm{padding:4px 9px;font-size:13px}
button:disabled{opacity:.4;cursor:not-allowed}
main{max-width:1100px;margin:auto;padding:14px 16px 60px}
.card{background:#fff;border:1px solid #e6ddd0;border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:#7a7068;font-size:13px}
h2{margin:0 0 6px;font-size:20px}
h3{margin:0 0 6px;font-size:16px}
.sec{margin-top:14px}
.sec h4{margin:0 0 4px;font-size:14px;color:#e2572a;border-left:4px solid #e2572a;padding-left:8px}
.sec ol,.sec ul{margin:4px 0;padding-left:22px}
.pre{white-space:pre-wrap}
.video{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000}
.video:fullscreen{padding-top:0!important;border-radius:0;width:100%!important;height:100%!important}.video:-webkit-full-screen{padding-top:0!important;border-radius:0;width:100%!important;height:100%!important}
.video img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.video .play{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(226,87,42,.9);color:#fff;font-size:38px;line-height:84px;text-align:center;pointer-events:none}
.video{cursor:pointer}
.video iframe{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;border:0}
select,input,textarea{font:inherit;padding:8px;border:1px solid #e6ddd0;border-radius:8px;color:#2b2622;background:#fff}
label.f{display:block;margin-top:10px;font-size:13px;color:#7a7068}
label.f>input:not([type=checkbox]),label.f>textarea,label.f>select{display:block;width:100%;margin-top:3px}
textarea{min-height:70px;resize:vertical;width:100%}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.checks label{background:#f4f1ec;border-radius:16px;padding:3px 10px;color:#2b2622;font-size:14px}
.tag{display:inline-block;font-size:12px;border-radius:10px;padding:1px 8px;background:#eee;color:#555}
.tag.d{background:#e2f5ea;color:#2e9b5a}.tag.t{background:#fff1df;color:#c9711c}.tag.o{background:#e3eefc;color:#2a6fd6}
.flag{color:#c9711c;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid #e6ddd0;text-align:left;vertical-align:top}
th{font-size:12px;color:#7a7068;font-weight:600}
/* 投影 */
.proj{background:#1f1b2e;color:#fff;border-radius:16px;padding:28px 20px;text-align:center;min-height:260px;display:flex;flex-direction:column;justify-content:center}
.proj .ref{color:#f2c46b;font-size:18px;margin-top:14px}
.proj .zh{font-size:34px;font-size:clamp(24px,5vw,44px);font-weight:700;line-height:1.5}
.proj .en{font-size:24px;font-size:clamp(18px,3.4vw,30px);margin-top:12px;color:#d8d4ee}
.tok{cursor:pointer;border-radius:4px}
.tok.hid{background:#f2c46b;color:transparent;user-select:none}
.lyrics{background:#1f1b2e;color:#fff;border-radius:16px;padding:24px;white-space:pre-wrap;text-align:center;line-height:1.8}
/* 點名 */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.kid{background:#fff;border:2px solid #e6ddd0;border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;user-select:none;transition:transform .1s}
.kid:active{transform:scale(.95)}
.kid .n{font-size:18px;font-weight:700}
.kid .p{font-size:13px;color:#7a7068}
.kid.here{border-color:#2e9b5a;background:#effaf3}
.kid.here.late{border-color:#c9711c;background:#fff1df}
.kid.got{box-shadow:0 0 0 3px #e2572a inset}
.kid.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.12);background:#fff4c2}}
.items{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.items button{border:2px solid #e6ddd0}
.items button.on{border-color:#e2572a;background:#fde8df;font-weight:700}
.rank li{font-size:20px;padding:6px 0;border-bottom:1px dashed #e6ddd0;display:flex;justify-content:space-between}
.rank{list-style:none;padding:0;margin:0}
.rank li b{color:#e2572a}
.medal{width:1.7em;display:inline-block}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,0.40);display:none;align-items:flex-start;justify-content:center;z-index:30;overflow-y:auto;padding:20px 10px}
.modal.on{display:flex}
.panel{background:#fff;border-radius:14px;max-width:720px;width:100%;padding:18px;position:relative}
.close{position:absolute;top:10px;right:10px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;border-top:1px solid #e6ddd0;padding-top:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2622;color:#fff;padding:8px 16px;border-radius:20px;z-index:40;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.entry{border-left:3px solid #e6ddd0;padding:4px 10px;margin:6px 0}
.entry.決議{border-color:#2e9b5a}.entry.待辦{border-color:#c9711c}
.stage{font-size:22px;line-height:1.7}
.stage h2{font-size:28px}
.bigcard{background:#1f1b2e;color:#fff;border-radius:16px;padding:26px 24px;font-size:26px;line-height:1.7}
.bigcard ol{margin:0;padding-left:1.4em}.bigcard li{margin:6px 0}
.steptitle{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.steptitle .num{width:44px;height:44px;border-radius:50%;background:#e2572a;color:#fff;font-size:22px;font-weight:700;text-align:center;line-height:44px;flex-shrink:0}
.steptitle h2{margin:0;font-size:28px}
.stepnav{display:flex;gap:10px;margin-top:18px}
.stepnav button{flex:1;font-size:18px;padding:14px 10px}
.lbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:14px;color:#7a7068}
.lbar select{flex:1;padding:6px}
.qcard{background:#fff;border:3px solid #e2572a;border-radius:16px;padding:30px 24px;font-size:30px;font-weight:700;text-align:center;min-height:180px}
nav button .n{display:inline-block;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.35);font-size:12px;line-height:20px;text-align:center;margin-right:4px}
nav button.on .n{background:#e2572a;color:#fff}
main.teach{max-width:none;padding:10px 16px;overflow:hidden}
main.teach>.stage{max-width:1400px;margin:0 auto}
.stage{display:flex;flex-direction:column;height:100%;min-height:0}
.stephead{display:flex;align-items:center;margin-bottom:8px;flex-shrink:0}
.stephead .num{width:40px;height:40px;border-radius:50%;background:#e2572a;color:#fff;font-size:20px;font-weight:700;text-align:center;line-height:40px;flex-shrink:0;margin-right:10px}
.stephead h2{margin:0;font-size:26px;white-space:nowrap}
.lsel{max-width:50%;padding:6px;font-size:14px;margin-left:10px}
.fill{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.fill>.fit,.fill>.vwrap{flex:1;min-height:0;overflow:hidden}
.vwrap .video{margin:0 auto}
.tbar{flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tbar>*{margin:0 6px 6px 0}
.fit{overflow:hidden}
.bigcard.fit{display:flex;flex-direction:column;justify-content:center}
.proj.fit{min-height:0;padding:16px}
.proj .zh{font-size:1em!important}.proj .en{font-size:.62em!important}.proj .ref{font-size:.45em!important}
.qcard.fit{display:flex;align-items:center;justify-content:center;min-height:0}
.kidsfit .kids{grid-template-columns:repeat(auto-fill,minmax(6.5em,1fr))}
.kidsfit .kid{padding:.5em .3em}.kidsfit .kid .n{font-size:1em}.kidsfit .kid .p{font-size:.7em}
.rank.fit li{font-size:1em}
.empty{text-align:center;color:#7a7068;padding:30px 10px}
.notice{background:#fff1df;border-radius:10px;padding:10px 12px;font-size:14px}
a{color:#2a6fd6}
/* ===== 手機版 ===== */
.show-m{display:none}
nav{scrollbar-width:none}nav::-webkit-scrollbar{display:none}
.items::-webkit-scrollbar,.tbar::-webkit-scrollbar{display:none}
@media (max-width:600px){
 input,select,textarea{font-size:16px!important}
 button{min-height:38px}
 .hrow{padding:8px 12px 2px}
 header h1{font-size:16px}
 nav{padding:4px 10px 8px}
 nav button{padding:7px 10px}
 main{padding:12px 12px 50px}
 main.teach{padding:8px 10px 6px}
 .stephead{flex-wrap:wrap;margin-bottom:6px}
 .stephead .num{width:32px;height:32px;line-height:32px;font-size:17px;margin-right:8px}
 .stephead h2{font-size:21px}
 .lsel{order:9;max-width:none;width:100%;margin:6px 0 0;padding:7px 8px}
 .stepnav{margin-top:8px;gap:8px}
 .stepnav button{font-size:16px;padding:12px 6px}
 .tbar.scroll,.items{flex-wrap:nowrap!important;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
 .tbar.scroll>*,.items>*{flex-shrink:0}
 .tbar.scroll .sp{display:none}
 .bigcard{padding:18px 16px;border-radius:14px}
 .qcard{padding:18px 14px}
 .hide-m{display:none!important}
 .show-m{display:inline!important}
 .kidsfit{overflow-y:auto!important;-webkit-overflow-scrolling:touch}
 .kidsfit .kids{grid-template-columns:repeat(3,1fr);gap:6px}
 .kidsfit .kid{padding:10px 4px}
 .kidsfit .kid .n{font-size:18px}.kidsfit .kid .p{font-size:12px}
 .ktable tr.krow{display:flex;flex-wrap:wrap;align-items:center;border-bottom:1px solid #e6ddd0;padding:8px 0}
 .ktable tr.krow td{border:0;padding:2px 4px}
 .ktable tr.krow td.nm{flex:1}
 .ktable tr.krow td.act{width:100%;text-align:left!important;white-space:normal!important}
 .ktable tr.khead{display:none}
 .panel{padding:16px 14px;border-radius:12px}
 .modal{padding:10px 6px}
 h2{font-size:19px}
 .card{padding:12px}
}
@media print{header,main,.actions,.close,.noprint{display:none!important}.modal{position:static;display:block!important;background:none;padding:0}.panel{max-width:none}}

@supports not (display:grid){.kids,.grid{display:flex;flex-wrap:wrap}.kid{width:6.5em;margin:.2em}}
@supports not (gap:1px){.row>*,.items>*,.btns>*,.checks>*,.who>*,nav>*,.actions>*{margin:3px}}
</style>
</head>

var DEFAULT_ITEMS = [{
  name: '認真唱歌',
  pts: 2
}, {
  name: '認真上課',
  pts: 2
}, {
  name: '朗誦英文經句',
  pts: 1
}, {
  name: '背誦英文經句',
  pts: 2
}, {
  name: '上台複寫經句',
  pts: 1
}, {
  name: '默寫金句',
  pts: 2
}, {
  name: '當天值日生',
  pts: 1
}];
var KEY = 'little_lambs_meadow_v1';
var uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
var today = () => {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};
var DB = {
  load() {
    try {
      var s = localStorage.getItem(KEY);
      if (s) {
        var d = JSON.parse(s);
        if (d && d.settings) return DB.fix(d);
      }
    } catch (e) {}
    return demo();
  },
  fix(d) {
    {
      {
        d.invites = d.invites || [];
        (d.log || []).forEach(l => {
          if (!l.id) {
            l.id = uid();
            l.t = l.t || 0;
          }
        });
        if (d.settings.auth === undefined) d.settings.auth = false;
        if (!d.settings.rules) d.settings.rules = DEFAULT_RULES.slice();
        if (!d.settings.prayer) d.settings.prayer = DEFAULT_PRAYER;
        if (!d.settings.cutoff) {
          d.settings.cutoff = '10:30';
          d.settings.onPts = 2;
          d.settings.latePts = 1;
        }
        if ((d.settings.items || []).map(x => x.name).join() === '背金句,帶聖經,幫忙收拾,熱心參與') d.settings.items = DEFAULT_ITEMS.map(x => Object.assign({}, x));

        (d.lessons || []).forEach(l => {
          var x = dm.lessons.find(y => y.title === l.title && y.video === l.video);
          if (x) {
            ['intro', 'iceName', 'prayer'].forEach(k => {
              if (!l[k]) l[k] = x[k];
            });
          }
        });
        (d.songs || []).forEach(sg => {
          if (sg.title === '（示範）本季主題詩歌' && sg.theme === undefined) sg.theme = true;

  D.songs.filter(x => x.theme && (!l.season || x.season === l.season)).forEach(x => ids.push(x.id));
  (l.songIds || []).forEach(i => {
    if (!ids.includes(i)) ids.push(i);
  });
  return ids.map(i => D.songs.find(x => x.id === i)).filter(Boolean);
}
function hasLyrics(s) {
  return s.lyrics && s.lyrics.trim() && s.lyrics.indexOf('貼上教會使用的歌詞') < 0;
}
function tWorship() {
  var l = cur();
  var list = worshipList(l);
  if (!list.length) list = D.songs.filter(x => !l.season || x.season === l.season);
  var vids = list.map(x => {
    var m = String(x.video || '').match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([\w-]{11})/);
    return m && !/[?&]list=/.test(x.video) ? m[1] : null;
  }).filter(Boolean);
  var q = vids.length > 1 ? ytQueue(vids) : null;
  var s = list.find(x => x.id === curSong) || list[0];
  if (s) curSong = s.id;
  var yt = s && ytId(s.video);
  var box = yt || q;
  var bar = `<div class="tbar scroll">${q ? `<button class="pri" style="font-size:18px" onclick="playFull('${box}','${q}')">▶ 全部連續播放（${vids.length} 首）</button>` : ''}
  ${list.map((x, i) => `<button class="${x.id === s.id ? 'blue' : 'ghost'}" onclick="curSong='${x.id}';showLyrics=false;render()">${i + 1}. ${x.theme ? '⭐ ' : ''}${h(x.title)}</button>`).join('')}
  <span class="sp"></span>${yt ? `<button class="pri" onclick="playFull('${yt}')">▶ 全螢幕播放這首</button>` : ''}${s && hasLyrics(s) ? `<button class="ghost" onclick="showLyrics=!showLyrics;render()">${showLyrics ? '🎬 看影片' : '📝 歌詞'}</button>` : ''}<button class="ghost" onclick="quickSongDlg()">＋ 加歌</button></div>`;
  if (!s) return stepPage(bar + '<div class="empty">這一課還沒有敬拜詩歌，按「＋ 加歌」貼上 YouTube 網址</div>');
  var main = showLyrics ? `<div class="lyrics fit" data-max="40" id="lyr" style="padding:16px"><b>${h(s.title)}</b>\n${h(s.lyrics)}</div>` : box ? `<div class="vwrap">${ytBox(box)}</div>` : s.video ? `<div class="empty"><a href="${h(s.video)}" target="_blank" rel="noopener">▶ 開啟詩歌影片</a></div>` : '<div class="empty">這首詩歌還沒有 YouTube 網址，可以到「老師區 → 詩歌」補上</div>';
  return stepPage(bar + main);
}
function quickSongDlg() {

function quickSong() {
  var u = document.getElementById('ws_u').value.trim();
  if (!ytId(u)) {
    toast('請貼上 YouTube 網址');
    return;
  }
  var l = cur();
  var t = document.getElementById('ws_t').value.trim() || '敬拜詩歌 ' + (worshipList(l).length + 1);
  var th = document.getElementById('ws_theme').checked;
  var sg = {
    id: uid(),
    title: t,
    season: l.season || '',
    theme: th,
    video: u,
    lyrics: '',
    notes: ''
  };
  D.songs.push(sg);
  if (!th && l.id) {
    l.songIds = l.songIds || [];
    l.songIds.push(sg.id);
  }
  curSong = sg.id;
  save('新增敬拜詩歌 ' + t);
  closeModal();
  render();
  toast('已加入 ' + t);
}

function enableAuth() {

function genInvite() {

    c = [...Array(6)].map(() => A[Math.floor(Math.random() * A.length)]).join('');
  } while (D.invites.some(i => i.code === c));

    code: c,
    note: val('iv_note'),
    by: user,

function copyInvite(c) {

}
function revokeInvite(c) {

function toggleT(id) {

function toggleRole(id) {
